
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name:  harbor-backup
spec:
  sourcePVC: harbor-data
  trigger:
    schedule: "50 */10 * * *"
  restic:
    pruneIntervalDays: 1
    repository: restic-harbor
    retain:
      hourly: 5
      daily: 4
      weekly: 3
      monthly: 2
      yearly: 1
    copyMethod: Snapshot
    # Clone binds at once on the snapshot's node; the cache follows the mover there.
    storageClassName: openebs-lvm-backup
    cacheStorageClassName: openebs-lvm
    unlock: "something"
