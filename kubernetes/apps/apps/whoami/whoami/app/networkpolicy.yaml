# Same rule as every other app here: Traefik only, so forward-auth can't be
# bypassed from other pods (e.g. newt).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whoami-ingress
spec:
  podSelector:
    matchLabels:
      app: whoami
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
