---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-beyla
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: beyla
      version: 1.16.11
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    tolerations: 
      - key: node-role.kubernetes.io/control-plane
        operator: "Exists"
        effect: "NoSchedule"
    serviceMonitor:
      enabled: true
    config:
      create: false
      name: "beyla-config"
      data:
        prometheus_export:
          port: 9090
          path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
data:
  beyla-config.yml: |
    log_level: INFO
    routes:
      unmatched: heuristic
    discovery:
      services:
        - k8s_namespace: apps
        - k8s_namespace: default
        - k8s_namespace: networking
        - k8s_namespace: auth
        - k8s_namespace: secured
        - k8s_namespace: flux-system
        # (removed a cluster-wide exe_path match for worker|backend|frontend|cilium|hubble:
        #  RKE2 runs Canal, not Cilium, and `namespace:` only relabeled matches, it did not filter)
        # - k8s_namespace: storage
        # - exe_path: (worker)|(backend)|(frontend) # any service exec that has name worker,backent...
        #   namespace: MyApplication 
        #   name: "TestLoadGenerator" # overwrites the built in name with this
        # - exe_path: tcpforwarder 
        #   namespace: network
    # was "text": printed every span to stdout, which filelog shipped to Loki
    trace_printer: disabled
    otel_traces_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
    otel_metrics_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics
    attributes:
      kubernetes:
        enable: true
        # Name services after the workload, not the Helm/Flux instance label:
        # app.kubernetes.io/instance merged all Flux controllers into "flux-system"
        # and named Traefik "traefik-networking". Pods without these labels fall
        # back to their owner (Deployment/StatefulSet) name.
        resource_labels:
          service.name:
            - app.kubernetes.io/name
            - app.kubernetes.io/component