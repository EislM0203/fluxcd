---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-lvm
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  volgroup: lvmvg
  thinProvision: "yes"
  fsType: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
# The volume lives on whichever node the first consumer lands on.
volumeBindingMode: WaitForFirstConsumer
# Only rke2-node-3 has the lvmvg data disk during the test.
allowedTopologies:
  - matchLabelExpressions:
      - key: kubernetes.io/hostname
        values: ["rke2-node-3"]
