apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-mcp
  labels:
    app: karakeep-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-mcp
  template:
    metadata:
      labels:
        app: karakeep-mcp
    spec:
      containers:
        # karakeep-mcp is a stdio-only MCP server, so it is wrapped with
        # supergateway to expose it over streamable HTTP for in-cluster
        # consumers (e.g. Bifrost) at http://karakeep-mcp:8000/mcp.
        - name: supergateway
          image: harbor.cloud.traunseenet.com/ghcr.io/supercorp-ai/supergateway:3.4.3
          args:
            - --stdio
            # Pinned to the karakeep server minor (0.33). npm's latest 0.33.x is
            # 0.33.0 while the server image is 0.33.1 — bump together with the
            # karakeep Deployment image, keeping the same minor.
            - npx -y @karakeep/mcp@0.33.0
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            - --streamableHttpPath
            - /mcp
            - --healthEndpoint
            - /healthz
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: KARAKEEP_API_ADDR
              value: http://karakeep:3000
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-mcp
                  key: KARAKEEP_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
