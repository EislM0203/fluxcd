---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: actual-budget
  name: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate # single-writer SQLite on a ReadWriteOnce PVC
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # image default user 'actual'
        runAsGroup: 1001
        fsGroup: 1001 # make the longhorn /data PVC writable
      containers:
        - name: actual-budget
          image: harbor.cloud.traunseenet.com/docker.io/actualbudget/actual-server:26.8.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          envFrom:
            - configMapRef:
                name: actual-budget-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-budget-data
