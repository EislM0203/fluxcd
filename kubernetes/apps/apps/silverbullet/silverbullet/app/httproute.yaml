# Login is the app's own (Dashboard accounts), so this route is the only front door:
# no HTTPRoute on :3001 (metrics) — scraped in-cluster by kube-prometheus.
# First run: an EMPTY /data/space (SB_FOLDER) boots the unconfigured setup wizard and every path 307s
# to /.setup/ (not a login bypass — that surface only exists while there is no
# users.json). Once provisioned, / serves the space bound to "/" and unbound hosts
# redirect to /.dashboard. None of that holds if the instance boots in legacy
# single-space mode, which is unauthenticated: see the boot-mode warning in
# kustomization.yaml.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silverbullet
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - silverbullet.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silverbullet
          port: 3000
