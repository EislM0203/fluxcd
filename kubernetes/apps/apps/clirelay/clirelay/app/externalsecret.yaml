---
# Vault secret/apps/clirelay: CLIRELAY_ADMIN_PASSWORD (bootstraps the first admin in an
# empty database; >= 12 chars with upper, lower and a non-alphanumeric character, or
# startup fails). Changing it later does not rotate the admin password. All of it ends
# up in the app's environment, so nothing else belongs at this path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clirelay
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: clirelay-secrets
  dataFrom:
    - extract:
        key: apps/clirelay
