---
# Assert expressions only print variable names, never values.
- name: Assert WireGuard private keys are set in the environment
  ansible.builtin.assert:
    quiet: true
    that: item.value is match('^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$')
    fail_msg: >-
      Private key for {{ item.key }} missing or malformed. Required env:
      TF_VAR_edge_wg_vps_private_key (VPS), EDGE_WG_HOME_OUTER_PRIVATE_KEY and
      EDGE_WG_HOME_INNER_PRIVATE_KEY (home VM).
  loop: "{{ wg_private_keys | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Assert public keys in group_vars/all.yml were filled in
  ansible.builtin.assert:
    quiet: true
    that: item is match('^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$')
    fail_msg: "Public key '{{ item }}' is still a placeholder or not a WireGuard key."
  loop: >-
    {{ [wg_vps_public_key, wg_home_outer_public_key, wg_home_inner_public_key]
       + (wg_admin_peers | map(attribute='public_key') | list) }}

- name: Assert vps_public_ip is set (from the tf-generated inventory)
  ansible.builtin.assert:
    quiet: true
    that: vps_public_ip | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: vps_public_ip missing from inventory (should be set by edge/tf).

- name: Assert ingress_ip is the cluster's public LB IP (not the placeholder)
  ansible.builtin.assert:
    quiet: true
    that: >-
      (ingress_ip | string) is match('^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$')
    fail_msg: >-
      ingress_ip in group_vars/all.yml is not a valid IPv4 address. Set it to the cluster's
      dedicated public LoadBalancer IP (= EDGE_PUBLIC_LB_IP in Flux cluster-settings).
