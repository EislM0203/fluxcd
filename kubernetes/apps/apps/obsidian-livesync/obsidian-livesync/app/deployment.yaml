---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: obsidian-livesync
  name: obsidian-livesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-livesync
  template:
    metadata:
      labels:
        app: obsidian-livesync
    spec:
      securityContext:
        # The couchdb image runs as uid/gid 5984; longhorn volumes come up
        # root-owned otherwise and CouchDB cannot write its data dir.
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: couchdb
          image: harbor.cloud.traunseenet.com/docker.io/library/couchdb:3.5@sha256:b80216f643e99d31df318c740dbc556ac08b56444030ed1d5e6d7b0d4e625213
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: obsidian-livesync-admin
          ports:
            - name: http
              containerPort: 5984
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d/local.ini
              subPath: local.ini
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: config
          configMap:
            name: obsidian-livesync-config
