---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: external-secrets
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    leaderElect: true
    image:
      repository: harbor.cloud.traunseenet.com/ghcr.io/external-secrets/external-secrets
    webhook:
      image:
        repository: harbor.cloud.traunseenet.com/ghcr.io/external-secrets/external-secrets
    certController:
      image:
        repository: harbor.cloud.traunseenet.com/ghcr.io/external-secrets/external-secrets
    serviceMonitor:
      enabled: true
      interval: 1m
    # grafana here is the grafana-operator, which consumes GrafanaDashboard CRs
    # and not sidecar ConfigMaps, so the chart's dashboard would go unused
    grafanaDashboard:
      enabled: false
