---
# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/opentelemetry-configuration/refs/heads/main/schema/common.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: opentelemetry
spec:
  tolerations: 
    - key: node-role.kubernetes.io/control-plane
      value: "true"
      effect: NoSchedule
  volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: rke2agent
    hostPath:
      path: /var/lib/rancher/rke2/agent/logs/
  # filelog read offsets (file_storage), kept on the node so a collector restart or
  # rollout resumes where it stopped instead of skipping the logs written meanwhile.
  - name: otelcol-state
    hostPath:
      path: /var/lib/otelcol
      type: DirectoryOrCreate
  volumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: rke2agent
    mountPath: /var/lib/rancher/rke2/agent/logs/
    readOnly: true
  - name: otelcol-state
    mountPath: /var/lib/otelcol
  # The hostPath dir is created root-owned; hand it to the collector's non-root user
  # (10001) instead of running the collector itself as root.
  initContainers:
  - name: chown-state
    image: harbor.cloud.traunseenet.com/docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: ["chown", "-R", "10001:10001", "/var/lib/otelcol"]
    securityContext:
      runAsUser: 0
      capabilities:
        drop: ["ALL"]
        add: ["CHOWN"]
    volumeMounts:
    - name: otelcol-state
      mountPath: /var/lib/otelcol
  env:
  - name: K8S_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  # Referenced by every ${env:MY_POD_IP} listen address below; it was never set, so the
  # receivers silently listened on all interfaces.
  - name: MY_POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP
  mode: daemonset
  # ~60Mi in use; the limit also sizes memory_limiter (limit_percentage of the cgroup limit)
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  config:
    receivers:
      filelog:
        storage: file_storage
        include_file_path: true
        include:
          - /var/log/pods/*/*/*.log
        # Never ship the collector's own logs: anything it logs per record would loop back in.
        exclude:
          - /var/log/pods/observability_opentelemetry-collector-*/*/*.log
        operators:
          - id: container-parser
            type: container
      jaeger:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:14250
          thrift_compact:
            endpoint: ${env:MY_POD_IP}:6831
          thrift_http:
            endpoint: ${env:MY_POD_IP}:14268
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http:
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"
            endpoint: ${env:MY_POD_IP}:4318
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
      file_storage:
        directory: /var/lib/otelcol/file_storage
        create_directory: true
    exporters:
      otlp/grafana_cloud_tempo:
        endpoint: grafana-tempo.observability.svc.cluster.local:4317
        tls:
          insecure: true
      otlphttp:
        endpoint: http://grafana-loki.observability.svc.cluster.local:3100/otlp
        tls:
          insecure: true
      # Prometheus' native OTLP receiver (enableOTLPReceiver); otlphttp appends /v1/metrics.
      # Before this, the metrics pipeline only had the debug exporter and dropped everything.
      otlphttp/prometheus:
        endpoint: http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/otlp
        tls:
          insecure: true
    processors:
      batch: {}
      # Needs the ClusterRole in rbac.yaml; without it every pod lookup was forbidden
      # and logs reached Loki with only the file-path attributes.
      k8sattributes:
        # DaemonSet: each collector only needs the pods on its own node
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          # service.name / service.namespace per the OTel k8s spec (Loki indexes both).
          # Two gaps vs Beyla are closed by transform/identity below: in this processor the
          # app.kubernetes.io/instance label overwrites the service.name annotation, and the
          # spec has no app.kubernetes.io/part-of -> service.namespace rule.
          otel_annotations: true
          metadata: [service.name, service.namespace, k8s.namespace.name, k8s.deployment.name, k8s.statefulset.name, k8s.daemonset.name, k8s.cronjob.name, k8s.job.name, k8s.node.name, k8s.pod.name, k8s.pod.uid, k8s.pod.start_time]
          # Temporary inputs for transform/identity, deleted there in every pipeline.
          annotations:
            - tag_name: tmp.identity.name_annotation
              key: resource.opentelemetry.io/service.name
              from: pod
            - tag_name: tmp.identity.namespace_annotation
              key: resource.opentelemetry.io/service.namespace
              from: pod
          labels:
            - tag_name: tmp.identity.part_of
              key: app.kubernetes.io/part-of
              from: pod
        passthrough: false
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
        - sources:
          - from: connection
      # Give logs the same identity Beyla gives traces: the service.name annotation wins
      # over the instance label, and app.kubernetes.io/part-of sets service.namespace
      # unless a service.namespace annotation does. Traces/metrics only drop the temp keys
      # (Beyla already resolved their identity).
      transform/identity:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["service.name"], attributes["tmp.identity.name_annotation"]) where attributes["tmp.identity.name_annotation"] != nil
              - set(attributes["service.namespace"], attributes["tmp.identity.part_of"]) where attributes["tmp.identity.part_of"] != nil and attributes["tmp.identity.namespace_annotation"] == nil
              - delete_matching_keys(attributes, "^tmp\\.identity\\.")
        trace_statements:
          - context: resource
            statements:
              - delete_matching_keys(attributes, "^tmp\\.identity\\.")
        metric_statements:
          - context: resource
            statements:
              - delete_matching_keys(attributes, "^tmp\\.identity\\.")
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
    service:
      extensions:
      - health_check
      - file_storage
      # Processor order: memory_limiter first, k8sattributes before batch (connection-based
      # pod association needs the per-request context that batching drops), batch last.
      # k8sattributes only fills attributes that are missing, so Beyla's service.name is kept.
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/identity, batch]
          # Span metrics come from Tempo's metrics-generator; the collector's spanmetrics
          # connector duplicated them and is removed.
          exporters: [otlp/grafana_cloud_tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform/identity, batch]
          exporters: [otlphttp/prometheus]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, transform/identity, batch]
          exporters: [otlphttp]
      telemetry:
        metrics: []
          # address: ${env:MY_POD_IP}:8888