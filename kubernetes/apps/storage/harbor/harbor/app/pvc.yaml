---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: harbor
  name: harbor-data
spec:
  accessModes: ["ReadWriteOnce"]
  # Same node as the Harbor pods (nodeSelector rke2-node-2 in release.yaml)
  storageClassName: openebs-lvm-rke2-node-2
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: harbor-restore
  resources:
    requests:
      storage: 1Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: harbor-restore
spec:
  trigger:
    manual: restore-rke2-node-2
  restic:
    repository: restic-harbor
    storageClassName: openebs-lvm-rke2-node-2
    accessModes: ["ReadWriteOnce"]
    copyMethod: Snapshot
    capacity: 1Gi
    enableFileDeletion: false
    cleanupCachePVC: true
    cleanupTempPVC: false
