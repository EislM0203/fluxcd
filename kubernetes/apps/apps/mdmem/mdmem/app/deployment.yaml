---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdmem
  labels:
    app: mdmem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mdmem
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mdmem
        app: mdmem
    spec:
      automountServiceAccountToken: false   # mdmem never talks to the API server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch   # new volumes come up root-owned
      containers:
        - name: mdmem
          # Pin tag AND digest. Renovate opens PRs for new vX.Y.Z releases
          # (library/* pulls anonymously).
          image: harbor.cloud.traunseenet.com/library/mdmem:0.8.3@sha256:9dcfa00abe2792940677aeaeff0e2dadeb19b477f34a92d51d9d40680531bd29
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: mdmem-env
            - secretRef:
                name: mdmem          # from Vault via the ExternalSecret
          ports:
            - name: mcp
              containerPort: 8080
            - name: ui
              containerPort: 8081
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: repos
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: ui
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz          # never checks Bifrost (§14.17)
              port: ui
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mdmem-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi   # eval runs and caches write here
        - name: repos
          configMap:
            name: mdmem-repos    # anchor registry (REPOS_FILE) + tag vocabulary (TAGS_FILE)
