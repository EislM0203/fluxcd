---
# Forward-auth via the shared oauth2-proxy (auth namespace) on an INTERNAL
# route (fin): the app has no login of its own, so without this anyone on the
# LAN/WG could read the financial data (UI and /api). Same groups as homepage:
# global edge_users AND homelab_admins.
# Not logged in -> 302 to Pocket ID; wrong group -> 403.
# fin-mcp and the fin-web nginx reach fin-api in-cluster and are not affected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-forward-auth-fin
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/?allowed_groups=homelab_admins
    trustForwardHeader: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
    # Session refreshes arrive as Set-Cookie on the 202; incl. split variants.
    addAuthCookiesToResponse:
      - __Secure-oauth2-proxy
      - __Secure-oauth2-proxy_0
      - __Secure-oauth2-proxy_1
      - __Secure-oauth2-proxy_2
      - __Secure-oauth2-proxy_3
