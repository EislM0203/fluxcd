# Backends reachable only from their own app (same namespace, podSelector: Calico
# evaluates after DNAT, so never select by Service IP). Kubelet probes come from the
# node and are not affected.
---
# Redis without a password (cache + Bull queues).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghostfolio-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: ghostfolio-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ghostfolio
      ports:
        - protocol: TCP
          port: 6379
---
# CNPG cluster ghostfolio-pg: the app on 5432, its own instances (replication, instance
# manager), the CNPG operator (instance manager API :8000; without it the cluster looks
# unhealthy and cannot be managed) and Prometheus (PodMonitor :9187, CNPG alerts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghostfolio-pg-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ghostfolio-pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ghostfolio
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: ghostfolio-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
