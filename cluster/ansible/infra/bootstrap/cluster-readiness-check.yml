---
- name: Verify all Kubernetes nodes are ready
  # On the server with its own admin kubeconfig: runs before Pocket ID exists,
  # and the PC keeps no admin client certificate.
  hosts: rke2_server
  become: yes
  gather_facts: false

  tasks:
    - name: Wait until all Kubernetes nodes are Ready
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false
      tags: [bootstrap, readiness]

    - name: Get node status
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
        get nodes
      register: node_status
      changed_when: false
      tags: [bootstrap, readiness]

    - name: Print node readiness summary
      ansible.builtin.debug:
        var: node_status.stdout_lines
      tags: [bootstrap, readiness]
