---
# yaml-language-server: $schema=https://kubernetes-schemas.devbu.io/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-manifests
  namespace: flux-system
spec:
  interval: 10m
  url: oci://ghcr.io/fluxcd/flux-manifests
  ref:
    tag: v2.9.6
    digest: sha256:e007ec3c575b9089fc7e96ad1d2159407be03450da7c220c6d25c8e8c1b42d01
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-manifests
  # A fresh cluster has 70+ Kustomizations, many with wait: true; a health check
  # holds a worker for up to its 15m timeout, and the default of 4 workers left
  # traefik, harbor and vault queued behind apps waiting on images that only
  # those three can serve.
  patches:
    - target:
        kind: Deployment
        name: (kustomize-controller|helm-controller)
      patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --concurrent=12
