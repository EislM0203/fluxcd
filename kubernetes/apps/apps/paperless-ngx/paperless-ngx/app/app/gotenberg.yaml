---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless-gotenberg
  name: paperless-gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gotenberg
  template:
    metadata:
      labels:
        app: paperless-gotenberg
        app.kubernetes.io/part-of: paperless
    spec:
      # Renders untrusted documents/URLs: own Kata VM instead of the node kernel.
      runtimeClassName: kata
      containers:
        - image: harbor.cloud.traunseenet.com/docker.io/gotenberg/gotenberg:9.9@sha256:0fc05327fcc4af8ba84bb99b3da35fe728840d98cef9d3bf0d701bd077834eb5
          name: gotenberg
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          env:
            # Java4Shell (CVE-2026-114938): pdftk-java runs here; drop once the image ships a fixed JDK.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:-UseBASE64Intrinsics"
          ports:
            - containerPort: 3000
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gotenberg
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: paperless-gotenberg
  type: ClusterIP
