---
# Vault apps/mcp/forgejo, key GITEA_ACCESS_TOKEN: token of a NON-admin bot
# (admin tokens honour ?sudo=), read-only scopes. Created and stored by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forgejo-mcp
  dataFrom:
    - extract:
        key: apps/mcp/forgejo
