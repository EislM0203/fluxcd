---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ghostfolio-app
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-addons
    - name: traefik-base
    - name: openebs-lvm
    - name: cnpg
    - name: harbor-app
    - name: external-secrets-app
    - name: hashicorp-vault-app
  path: ./kubernetes/apps/apps/ghostfolio/ghostfolio/app
  prune: true
  wait: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: ghostfolio
      namespace: apps
    - apiVersion: apps/v1
      kind: Deployment
      name: ghostfolio-redis
      namespace: apps
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: ghostfolio-pg
      namespace: apps
  interval: 15m
  retryInterval: 15m
  timeout: 15m
  targetNamespace: apps
