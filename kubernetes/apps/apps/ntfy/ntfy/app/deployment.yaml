apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ntfy
        app: ntfy
    spec:
      containers:
      - name: ntfy
        image: harbor.cloud.traunseenet.com/docker.io/binwiederhier/ntfy:v2.36.0@sha256:fb48c413eb11d50339962b5d62cddce0f800e7f77c626d638a7c20cb7e9c4465
        args: ["serve"]
        envFrom:
        - configMapRef:
            name: ntfy
        - secretRef:
            name: ntfy-secrets
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: "/etc/ntfy"
        - name: templates
          mountPath: "/etc/ntfy/templates"
          readOnly: true
      volumes:
        - name: templates
          configMap:
            name: ntfy-templates
        - name: data
          nfs:
            server: 10.0.0.154
            path: /mnt/nvmepool/kubernetes/ntfy
