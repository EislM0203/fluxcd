apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-mcp
  labels:
    app: karakeep-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-mcp
  template:
    metadata:
      labels:
        app: karakeep-mcp
    spec:
      initContainers:
        # Pre-warms the npm cache so that supergateway's per-request npx spawn
        # does not download @karakeep/mcp from the registry at runtime.
        # Without this, the cold download exceeds Bifrost's 30-second MCP
        # initialize timeout (MCPClientConnectionEstablishTimeout), causing a
        # context deadline exceeded and a supergateway crash loop.
        - name: npm-prefetch
          image: harbor.cloud.traunseenet.com/ghcr.io/supercorp-ai/supergateway:3.4.3
          env:
            - name: NPM_CONFIG_CACHE
              value: /npm-cache
            - name: KARAKEEP_API_ADDR
              value: placeholder
            - name: KARAKEEP_API_KEY
              value: placeholder
          command:
            - sh
            - -c
            # Run the MCP server via npx with stdin closed so it exits immediately
            # after startup. This populates $NPM_CONFIG_CACHE/_npx/<hash>/ so that
            # every subsequent spawn in the main container is a direct node exec
            # (~0.5s) rather than a tarball extraction (several seconds).
            - timeout 60 npx -y @karakeep/mcp@0.33.0 </dev/null; exit 0
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
      containers:
        # karakeep-mcp is a stdio-only MCP server, so it is wrapped with
        # supergateway to expose it over streamable HTTP for in-cluster
        # consumers (e.g. Bifrost) at http://karakeep-mcp:8000/mcp.
        - name: supergateway
          image: harbor.cloud.traunseenet.com/ghcr.io/supercorp-ai/supergateway:3.4.3
          args:
            - --stdio
            # Pinned to the karakeep server minor (0.33). npm's latest 0.33.x is
            # 0.33.0 while the server image is 0.33.1 — bump together with the
            # karakeep Deployment image, keeping the same minor.
            - npx -y @karakeep/mcp@0.33.0
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            - --streamableHttpPath
            - /mcp
            - --healthEndpoint
            - /healthz
            # Stateless mode (supergateway's default for streamableHttp) spawns
            # a fresh `npx @karakeep/mcp` child per HTTP request and never reaps
            # them. Measured on the 1Gi pod: container_processes climbed
            # 1 -> 9 -> 15 -> 19 -> 24 -> 33 -> 38 while working-set memory went
            # 25MB -> 962MB in three minutes, OOMKilling the container. No memory
            # limit fixes that. Stateful mode spawns one child per MCP *session*
            # (only on isInitializeRequest) and kills it on transport close, so
            # Beyla instruments a single long-lived process instead of dozens.
            - --stateful
            # Without this a session is only torn down when the client sends an
            # explicit DELETE, so every Bifrost reconnect would strand another
            # child. Bifrost re-initializes on its next request after a reap.
            - --sessionTimeout
            - "1800000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: KARAKEEP_API_ADDR
              value: http://karakeep:3000
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-mcp
                  key: KARAKEEP_API_KEY
            - name: NPM_CONFIG_CACHE
              value: /npm-cache
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              # With --stateful there is a single long-lived MCP child (~150MB)
              # plus supergateway itself, so this is generous headroom rather
              # than a workaround. Kept at 1Gi while the fix is validated; it can
              # be tightened once the memory curve is confirmed flat.
              memory: 1Gi
      volumes:
        - name: npm-cache
          emptyDir: {}
