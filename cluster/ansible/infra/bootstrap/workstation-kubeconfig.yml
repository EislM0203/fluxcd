---
# kubectl access from this workstation through Pocket ID (OIDC, see
# templates/rke2-authentication-config.yaml.j2). Touches nothing on the nodes
# except reading the cluster CA, so it is also the restore step for a new or
# reinstalled PC: `make workstation-kubeconfig`. bootstrap-infra runs it last,
# because a rebuilt cluster has a new CA.
- name: Configure kubectl on this workstation
  hosts: rke2_server
  become: yes
  gather_facts: false
  vars:
    workstation_home: "{{ lookup('env', 'HOME') }}"
    workstation_kubeconfig: "{{ workstation_home }}/.kube/config"
    # Absolute path, so the kubeconfig does not depend on ~/.krew/bin being in PATH.
    workstation_oidc_login: "{{ workstation_home }}/.krew/bin/kubectl-oidc_login"
    # The CA certificate alone (public): the admin kubeconfig next to it also holds
    # the system:admin key, which never leaves the server.
    rke2_server_ca: /var/lib/rancher/rke2/server/tls/server-ca.crt

  tasks:
    - name: Read the cluster CA certificate
      ansible.builtin.slurp:
        src: "{{ rke2_server_ca }}"
      register: server_ca
      run_once: true

    - name: Check that krew is installed
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command: kubectl krew version
      changed_when: false

    # krew pins each plugin release by sha256 in its index (upstream: int128/kubelogin).
    - name: Install the kubelogin plugin
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.command: kubectl krew install oidc-login
      args:
        creates: "{{ workstation_oidc_login }}"

    - name: Create ~/.kube
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.file:
        path: "{{ workstation_kubeconfig | dirname }}"
        state: directory
        mode: '0700'

    # No credentials in here: kubelogin fetches a 1 h Pocket ID token and caches it
    # in ~/.kube/cache/oidc-login. Default is device code (works in SSH sessions too:
    # it prints a URL + code to confirm on any device); `--context rke2` logs in
    # through a browser on this machine instead. Only confirm codes you started.
    - name: Write the OIDC kubeconfig
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: rke2
              cluster:
                server: https://{{ ansible_host }}:6443
                certificate-authority-data: {{ server_ca.content }}
          users:
          {% for name, grant in [('oidc', 'authcode'), ('oidc-device', 'device-code')] %}
            - name: {{ name }}
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: {{ workstation_oidc_login }}
                  args:
                    - get-token
                    - --oidc-issuer-url={{ rke2_oidc_issuer_url }}
                    - --oidc-client-id={{ rke2_oidc_client_id }}
                    # preferred_username comes with profile, the group list with groups
                    - --oidc-extra-scope=profile
                    - --oidc-extra-scope=groups
                    - --grant-type={{ grant }}
                  interactiveMode: IfAvailable
          {% endfor %}
          contexts:
            - name: rke2
              context:
                cluster: rke2
                user: oidc
            - name: rke2-device
              context:
                cluster: rke2
                user: oidc-device
          current-context: rke2-device
        dest: "{{ workstation_kubeconfig }}"
        mode: '0600'
        # A replaced kubeconfig stays next to it as config.<timestamp>~.
        backup: true
