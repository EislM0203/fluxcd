apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |
    endpoints:
      ###########################
      # Auth
      ###########################
      - name: PocketID
        url: "http://pocket-id.auth.svc.cluster.local:1411"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      ###########################
      # Apps
      ###########################
      - name: Homepage
        # Server-side renders every tile on request, so it is meaningfully
        # slower than a bare health endpoint -- 1s rather than the usual 500ms.
        url: "http://homepage.apps.svc.cluster.local:3000"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: TREK
        # /api/health is unauthenticated and is what upstream's own container
        # healthcheck polls. SQLite means the check also fails if the data PVC
        # goes read-only, which a bare TCP probe would miss.
        url: "http://trek.apps.svc.cluster.local:3000/api/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 700"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Jellyfin
        url: "http://jellyfin.apps.svc.cluster.local:8096/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == Healthy"
          - "[RESPONSE_TIME] < 700"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Navidrome
        url: "http://navidrome.apps.svc.cluster.local:4533/rest/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Ntfy
        url: "http://ntfy.apps.svc.cluster.local/v1/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].healthy == true"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Obsidian LiveSync
        # /_up is the only unauthenticated route (require_valid_user_except_for_up),
        # and it reports the node's own health rather than just TCP reachability.
        url: "http://obsidian-livesync.apps.svc.cluster.local:5984/_up"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == ok"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Paperless NGX
        url: "http://paperless.apps.svc.cluster.local/accounts/login/?next=/"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      ###########################
      # Storage
      ###########################
      - name: MinIO S3
        url: "http://minio-service.storage.svc.cluster.local:9001/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Harbor Portal
        url: "http://harbor-portal.storage.svc.cluster.local/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Gitea
        url: "http://gitea.storage.svc.cluster.local:3000/api/healthz"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].status == pass"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      ###########################
      # observability
      ###########################
      - name: Prometheus
        url: "http://prometheus-operated.observability.svc.cluster.local:9090/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == Prometheus Server is Healthy."
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Alertmanager
        url: "http://alertmanager-operated.observability.svc.cluster.local:9093/-/ready"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Loki
        url: "http://grafana-loki-headless.observability.svc.cluster.local:3100/ready"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == ready"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Tempo
        url: "http://grafana-tempo.observability.svc.cluster.local:3200/ready"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == ready"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Grafana
        url: "http://grafana-service.observability.svc.cluster.local:3000/api/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY].database == ok"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: oCIS
        # End-to-end through nginx-proxy-manager, i.e. what a user actually
        # hits. Catches both oCIS being down and NPM/openresty being stopped.
        url: "https://ocis.local.traunseenet.com"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 1000"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: oCIS Certificate
        # Deliberately hits the LXC directly rather than the hostname: NPM
        # terminates TLS with its own Let's Encrypt cert, so checking
        # ocis.local.traunseenet.com would watch the wrong certificate and never
        # see this expire. oCIS generates its own self-signed certs with exactly
        # one year validity and silently breaks login (HTTP 500, idp cannot bind
        # to idm over LDAPS) the moment they lapse -- insecure skips
        # verification while Gatus still reads the presented chain, so the
        # warning arrives 10 days before rather than on the morning it breaks.
        url: "https://10.0.0.114:9200/"
        interval: 1h
        client:
          insecure: true
        conditions:
          - "[STATUS] == 200"
          - "[CERTIFICATE_EXPIRATION] > 240h"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "24h"
            description: "oCIS TLS certificate expires in under 10 days"
            failure-threshold: 2
            send-on-resolved: true
      ###########################
      # Networking
      ###########################
      - name: Technitium DNS
        # A real DNS query against the server itself (LXC at 10.0.0.99), not the
        # admin UI -- technitium.local.traunseenet.com resolves to NPM on
        # 10.0.0.103, so an HTTP check there would pass while DNS was down.
        # Querying the zone apex proves Technitium is answering AND is
        # authoritative for traunseenet.com without depending on any individual
        # record: an apex with no A record still returns NOERROR, while a missing
        # or broken zone returns NXDOMAIN or REFUSED and fails the check.
        # external-dns writes every cluster record here over RFC2136, so this
        # failing means new ingress hostnames stop resolving cluster-wide.
        url: "10.0.0.99"
        interval: 1m
        dns:
          query-name: "traunseenet.com"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
      - name: Traefik
        url: "http://traefik-api.networking.svc.cluster.local:8080/ping"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[BODY] == OK"
          - "[RESPONSE_TIME] < 500"
        alerts:
          - type: "ntfy"
            minimum-reminder-interval: "30m"
            description: "healthcheck failed"
            failure-threshold: 5
            send-on-resolved: true
    alerting:
      ntfy:
        topic: "gatus"
        url: "http://ntfy.apps.svc.cluster.local"
        priority: 4
    storage:
      type: sqlite
      path: /etc/gatus/data.db
    metrics: true