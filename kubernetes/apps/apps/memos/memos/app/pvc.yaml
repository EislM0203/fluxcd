---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: memos
  name: memos-data
  annotations:
    numberOfReplicas: '1'
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-storage
  # Fresh install: no restic snapshot exists yet, so the PVC starts empty.
  # To RESTORE from a volsync backup later, uncomment the dataSourceRef below
  # together with the ReplicationDestination block, then reconcile.
  # dataSourceRef:
  #   kind: ReplicationDestination
  #   apiGroup: volsync.backube
  #   name: memos-restore
  resources:
    requests:
      storage: 5Gi
