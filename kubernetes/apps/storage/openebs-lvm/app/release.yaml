---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
spec:
  interval: 30m
  chart:
    spec:
      chart: lvm-localpv
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    analytics:
      enabled: false
    crds:
      csi:
        # snapshot-controller (kube-system) already owns the VolumeSnapshot CRDs
        volumeSnapshots:
          enabled: false
    lvmController:
      snapshotController:
        enabled: false
    lvmNode:
      # thin pool fill level etc., for the "never let the pool run full" alert
      serviceMonitor:
        enabled: true
    lvmPlugin:
      image:
        registry: harbor.cloud.traunseenet.com/docker.io/
