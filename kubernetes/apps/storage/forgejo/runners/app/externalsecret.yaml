---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Forgejo API token (bot ci-runner-bot, scope write:admin) for the autoscaler.
# Vault: storage/forgejo-runners, key FORGEJO_API_TOKEN (the key the Deployment
# reads). No reloader: after rotating, restart deploy/forgejo-runner-autoscaler.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-autoscaler-token
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: forgejo-runner-autoscaler-token
  dataFrom:
    - extract:
        key: storage/forgejo-runners
