apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-mcp
  labels:
    app: paperless-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-mcp
  template:
    metadata:
      labels:
        app: paperless-mcp
        app.kubernetes.io/part-of: paperless
    spec:
      containers:
        - name: paperless-mcp
          image: harbor.cloud.traunseenet.com/ghcr.io/barryw/paperlessmcp:v0.6.2@sha256:8381a2b642a4160178e934d3ff774dbd06a8c04b6fac5828e3ccb6789a28fff4
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paperless-mcp-env
          env:
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: paperless-mcp
                  key: PAPERLESS_API_TOKEN
          volumeMounts:
            # .NET needs writable scratch space; the image has no USER, so the
            # UID below is only enforced from here.
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654 # APP_UID baked into the dotnet/aspnet base image
            runAsGroup: 1654
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          # The server maps only /mcp, which rejects probe-shaped GETs, so there
          # is no HTTP path that returns 2xx unauthenticated.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
