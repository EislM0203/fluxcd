apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-mcp
  labels:
    app: forgejo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mcp
        app: forgejo-mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo-mcp
          # b4mad forgejo-mcp (Forgejo-native, incl. Forgejo 16 Actions jobs/logs). Not
          # proxied by Harbor: pulled directly, pinned by digest (cosign-signed upstream).
          image: git.b4mad.industries/agentic-forges/forgejo-mcp:v3.3.0@sha256:9ffdde38b9825666227676d1abbe410646014272fe9c317cb3435c0a6f3e5ad2
          # Passthrough auth and no token here: every request must carry its own
          # Authorization header (Bifrost sends the read-only bot token, FORGEJO_AUTH_HEADER),
          # anything else gets 401. Do NOT enable --allow-operator-token-fallback.
          # No read-only switch in this server: write tools exist but the bot token has
          # read scopes only, and Bifrost's tools_to_execute is the allow-list.
          # In-cluster URL, so no TLS hairpin through Traefik (Forgejo NP admits this pod).
          args:
            - --transport=http
            - --http-port=8080
            - --host=0.0.0.0
            - --allowed-hosts=forgejo-mcp.apps.svc.cluster.local
            - --url=http://forgejo.storage.svc.cluster.local:3000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # No health endpoint (every path answers 401 without a token): TCP probes.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
