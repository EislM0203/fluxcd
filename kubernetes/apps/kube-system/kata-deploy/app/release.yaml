---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kata-deploy
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 4.3.1
    digest: sha256:8eab352a59b42dc7b3aebe87d4114b936a8576967d4800047ce708fcebb61d2e
  url: oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy
---
# Kata Containers: pods with runtimeClassName "kata" run in their own lightweight
# QEMU VM (nested KVM; the Proxmox VMs expose svm/vmx and /dev/kvm). kata-deploy
# copies the runtime onto each selected node, adds it to RKE2's containerd
# (config-v3.toml.tmpl / drop-in) and restarts the RKE2 agent once. Nodes that
# finish get katacontainers.io/kata-runtime=true; the RuntimeClasses select on
# that label, so Kata pods only ever land on installed nodes.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kata-deploy
spec:
  interval: 15m
  # The kata-deploy image is ~1.7 GB; a cold pull through the Harbor proxy
  # alone outlasts Helm's default 5m wait.
  timeout: 20m
  chartRef:
    kind: OCIRepository
    name: kata-deploy
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    k8sDistribution: rke2
    image:
      # tag stays empty = chart appVersion, so image and chart move together.
      reference: harbor.cloud.traunseenet.com/ghcr.io/kata-containers/kata-deploy
    imagePullPolicy: IfNotPresent
    # Every node except rke2-node-2. Each one needs the containerd drop-in import
    # first (cluster/ansible/infra/maintenance/configure-containerd-dropins.yml),
    # otherwise the installer crash-loops there. rke2-node-2 (Intel N100, 3 CPU /
    # 8 GiB): QEMU starts but the guest agent never answers on vsock, and the node
    # is too small for VM-per-pod anyway. Removing the DaemonSet pod there also
    # removes the runtime and its katacontainers.io/kata-runtime label.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - rke2-node-2
    # Only the Rust QEMU shim (the 4.x default); no Cloud Hypervisor, Firecracker,
    # confidential-computing or NVIDIA variants.
    shims:
      disableAll: true
      qemu-runtime-rs:
        enabled: true
    defaultShim:
      amd64: qemu-runtime-rs
    # Workloads opt in with runtimeClassName: kata (alias of kata-qemu-runtime-rs).
    runtimeClasses:
      enabled: true
      createDefault: true
      defaultName: kata
      overheadEnabled: true
    # Plain overlayfs images; no nydus/erofs snapshotter on the nodes.
    snapshotter:
      setup: []
    node-feature-discovery:
      enabled: false
    nodeFeatureRules:
      create: false
