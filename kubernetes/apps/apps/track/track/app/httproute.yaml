---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: track
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - track.cloud.traunseenet.com
  rules:
    # Everything via the web pod (its nginx proxies /api to track-api), all of it
    # behind Pocket ID (middleware-oauth2.yaml).
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-track
      backendRefs:
        - name: track-web
          port: 80
