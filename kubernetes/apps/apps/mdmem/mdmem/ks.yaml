---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mdmem-app
  namespace: flux-system
spec:
  targetNamespace: apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: mdmem
  dependsOn:
    - name: traefik-base
    - name: longhorn-addons
    - name: cert-manager-addons
    - name: volsync
    - name: harbor-app                # the image is pulled from in-cluster Harbor
    - name: hashicorp-vault-app       # the ExternalSecret needs Vault reachable
    - name: external-secrets-app
    - name: bifrost-app               # embeddings + the MCP front door
  path: ./kubernetes/apps/apps/mdmem/mdmem/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  wait: true
  interval: 15m
  retryInterval: 15m
  timeout: 15m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: mdmem
      namespace: apps
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mdmem-backup
  namespace: flux-system
spec:
  targetNamespace: apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: mdmem
  dependsOn:
    - name: mdmem-app
    - name: volsync
  path: ./kubernetes/apps/apps/mdmem/mdmem/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 15m
  timeout: 15m
