apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-newt
  labels:
    app: k8s-newt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-newt
  template:
    metadata:
      labels:
        app: k8s-newt
    spec:
      containers:
        - name: k8s-newt
          image: harbor.cloud.traunseenet.com/docker.io/fosrl/newt:1.15.0@sha256:d69d047c816ca7721eae90d5f3cd3be53b615b3d498678be21488d666538ee5c
          args:
            - --blueprint-file
            - /etc/newt/blueprint.yaml
          volumeMounts:
            - name: blueprint
              mountPath: /etc/newt/blueprint.yaml
              subPath: blueprint.yaml
              readOnly: true
          env:
            - name: PANGOLIN_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: k8s-newt-auth
                  key: PANGOLIN_ENDPOINT
            - name: NEWT_ID
              valueFrom:
                secretKeyRef:
                  name: k8s-newt-auth
                  key: NEWT_ID
            - name: NEWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: k8s-newt-auth
                  key: NEWT_SECRET
          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"
            requests:
              memory: "128Mi"
              cpu: "250m"
          imagePullPolicy: IfNotPresent
      volumes:
        - name: blueprint
          secret:
            secretName: k8s-newt-blueprint
---
