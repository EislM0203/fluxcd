---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# ntfy publish token for Alertmanager's ntfy-* receivers (release-prometheus.yaml,
# alertmanagerSpec.secrets). Unlike the other ExternalSecrets (dataFrom.extract
# of the app's own path) this picks ONE key from ntfy's entry (apps/ntfy), where
# the token is provisioned for the write-only ntfy user `alerts`: single source
# for rotation, and the rest of apps/ntfy never lands in observability.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-ntfy
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-ntfy
  data:
    - secretKey: token
      remoteRef:
        key: apps/ntfy
        property: ALERTS_NTFY_TOKEN
