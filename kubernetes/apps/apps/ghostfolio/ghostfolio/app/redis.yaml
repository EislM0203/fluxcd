---
# Cache and job queue only (no persistence needed); reachable only from Ghostfolio
# (networkpolicy.yaml), hence no password (REDIS_PASSWORD defaults to empty).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ghostfolio-redis
  name: ghostfolio-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghostfolio-redis
  template:
    metadata:
      labels:
        app: ghostfolio-redis
        app.kubernetes.io/part-of: ghostfolio
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - image: harbor.cloud.traunseenet.com/docker.io/library/redis:8.10.3@sha256:f245f4c83b84a9e9a0588da1c9456e579455310f0945d5db52cd2ba27f2000cc
          name: redis
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - mountPath: /data
              name: redis-data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ghostfolio-redis
spec:
  type: ClusterIP
  selector:
    app: ghostfolio-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
