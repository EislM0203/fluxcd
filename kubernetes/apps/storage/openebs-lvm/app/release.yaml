---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-lvm
spec:
  interval: 30m
  chart:
    spec:
      chart: lvm-localpv
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: openebs-lvm
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: openebs-lvm-lvm-localpv-node
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: openebs-lvm-lvm-localpv-node
              spec:
                template:
                  spec:
                    containers:
                      - name: openebs-lvm-plugin
                        volumeMounts:
                          - name: lvmlocal
                            mountPath: /etc/lvm/lvmlocal.conf
                            subPath: lvmlocal.conf
                            readOnly: true
                    volumes:
                      - name: lvmlocal
                        configMap:
                          name: openebs-lvm-lvmlocal
  values:
    analytics:
      enabled: false
    crds:
      csi:
        # snapshot-controller (kube-system) already owns the VolumeSnapshot CRDs
        volumeSnapshots:
          enabled: false
    lvmController:
      snapshotController:
        enabled: false
    lvmNode:
      # thin pool fill level etc., for the "never let the pool run full" alert
      serviceMonitor:
        enabled: true
    # lvmPlugin pulls from docker.io directly, not through Harbor: Harbor runs in
    # this cluster on openebs-lvm volumes, so a Harbor-proxied storage driver
    # cannot start on a fresh cluster (both wait for each other).
