---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: services
spec:
  groups:
    - name: services
      rules:
        # traces_spanmetrics_* is generated by Tempo from Beyla's (and apps' own) traces.
        # Server spans are marked as errors for HTTP 5xx / failed RPCs.
        - alert: ServiceHighErrorRate
          expr: >-
            (
              sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[10m]))
              / sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[10m]))
            ) > 0.05
            and sum by (service) (rate(traces_spanmetrics_calls_total{span_kind="SPAN_KIND_SERVER"}[10m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.service }} is failing {{ $value | humanizePercentage }} of requests'
            description: >-
              More than 5% of server requests have errored for 15 minutes (ignored below ~3 requests/minute).
              Look at the service's traces in Tempo.
