---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # LAN, via the Gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Euro-Office fetches and saves documents via StorageUrl
        - podSelector:
            matchLabels:
              app: eurooffice
        # Gatus health check (/status.php)
        - podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud-redis-master
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-imaginary-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud-imaginary
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 9000
---
# Browsers (Traefik/Pangolin) load the editors; Nextcloud calls it on DocumentServerInternalUrl
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eurooffice-ingress
spec:
  podSelector:
    matchLabels:
      app: eurooffice
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 80
