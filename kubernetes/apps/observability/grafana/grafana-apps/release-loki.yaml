---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-loki
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: loki
      version: 18.15.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      analytics:
        reporting_enabled: false
      server:
        log_level: info
      commonConfig:
        replication_factor: 1
      ingester:
        chunk_encoding: snappy
      # limits_config.retention_period is only enforced by the compactor with
      # retention enabled; without this block no logs were ever deleted.
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      limits_config:
        retention_period: 30d
        allow_structured_metadata: true
        # No otlp_config: the previous one was the example from Loki's OTel docs
        # (service.group index label, drop all log attributes but user.id) and dropped
        # log.iostream/log.file.path. Defaults index service.name/namespace and the k8s
        # workload attributes; other attributes become structured metadata.
    # Scrape Loki itself so ingestion failures can alert.
    monitoring:
      serviceMonitor:
        enabled: true
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn-storage
        size: 50Gi
    # ingress:
    #   enabled: true
    #   ingressClassName: "traefik"
    #   annotations:
    #       traefik.ingress.kubernetes.io/router.entrypoints: websecure
    #       cert-manager.io/cluster-issuer: "letsencrypt-prod"
    #   hosts:
    #     - &host loki.cloud.traunseenet.com
    #   # -- TLS configuration for the ingress. Hosts passed through the `tpl` function to allow templating
    #   tls:
    #     - secretName: loki-cert
    #       hosts:
    #         - *host
    gateway:
      replicas: 0
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: grafanadatasource-loki
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: loki
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://grafana-loki.observability.svc.cluster.local:3100
    jsonData:
      maxLines: 1000
