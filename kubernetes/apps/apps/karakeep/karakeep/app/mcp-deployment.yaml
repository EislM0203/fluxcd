apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-mcp
  labels:
    app: karakeep-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-mcp
  template:
    metadata:
      labels:
        app: karakeep-mcp
    spec:
      initContainers:
        # Warms the npx cache so the first spawn beats Bifrost's hardcoded
        # 30s MCP initialize timeout; a cold download does not.
        - name: npm-prefetch
          image: harbor.cloud.traunseenet.com/ghcr.io/supercorp-ai/supergateway:3.4.3
          env:
            - name: NPM_CONFIG_CACHE
              value: /npm-cache
            - name: KARAKEEP_API_ADDR
              value: placeholder
            - name: KARAKEEP_API_KEY
              value: placeholder
          command:
            - sh
            - -c
            # stdin closed so the server exits at once, leaving _npx/ populated.
            - timeout 60 npx -y @karakeep/mcp@0.33.0 </dev/null; exit 0
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
      containers:
        # karakeep-mcp is stdio-only, so supergateway exposes it over
        # streamable HTTP for Bifrost at http://karakeep-mcp:8000/mcp.
        - name: supergateway
          image: harbor.cloud.traunseenet.com/ghcr.io/supercorp-ai/supergateway:3.4.3
          args:
            - --stdio
            # Bump together with the karakeep image, keeping the same minor.
            - npx -y @karakeep/mcp@0.33.0
            - --outputTransport
            - streamableHttp
            - --port
            - "8000"
            - --streamableHttpPath
            - /mcp
            - --healthEndpoint
            - /healthz
            # Default stateless mode spawns a child per request and never reaps
            # them (38 procs / 962MB in 3min -> OOM). Stateful spawns one child
            # per session and kills it on close.
            - --stateful
            # Reap sessions abandoned without an explicit DELETE, so Bifrost
            # reconnects cannot strand children.
            - --sessionTimeout
            - "1800000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: KARAKEEP_API_ADDR
              value: http://karakeep:3000
            - name: KARAKEEP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: karakeep-mcp
                  key: KARAKEEP_API_KEY
            - name: NPM_CONFIG_CACHE
              value: /npm-cache
          volumeMounts:
            - name: npm-cache
              mountPath: /npm-cache
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              # Headroom while the stateful fix is validated; tighten once flat.
              memory: 1Gi
      volumes:
        - name: npm-cache
          emptyDir: {}
