---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: obsidian-livesync
  name: obsidian-livesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: obsidian-livesync
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: obsidian-livesync
        app: obsidian-livesync
    spec:
      securityContext:
        # The couchdb image runs as uid/gid 5984; longhorn volumes come up
        # root-owned otherwise and CouchDB cannot write its data dir.
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # local.ini cannot be mounted into /opt/couchdb/etc/local.d directly.
        # The CouchDB entrypoint runs
        #   find /opt/couchdb ! \( -user couchdb -group couchdb \) -exec chown -f couchdb:couchdb {} +
        # and a ConfigMap mount is read-only and root-owned, so that chown fails,
        # find exits non-zero, and `set -e` kills the entrypoint with status 1 and
        # no output at all. Copying the file into a writable emptyDir instead lets
        # the entrypoint chown it and drop its own docker.ini beside it.
        - name: seed-config
          image: harbor.cloud.traunseenet.com/docker.io/library/couchdb:3.5@sha256:bed314d10cdf58c0fff63352db4c3f168df58a185a773c0e2295105375c5ef10
          command:
            - sh
            - -c
            - |
              cp /tmp/config/local.ini /opt/couchdb/etc/local.d/local.ini
              chown 5984:5984 /opt/couchdb/etc/local.d/local.ini
          volumeMounts:
            - name: config-src
              mountPath: /tmp/config
            - name: config
              mountPath: /opt/couchdb/etc/local.d
      containers:
        - name: couchdb
          image: harbor.cloud.traunseenet.com/docker.io/library/couchdb:3.5@sha256:bed314d10cdf58c0fff63352db4c3f168df58a185a773c0e2295105375c5ef10
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: obsidian-livesync-admin
          ports:
            - name: http
              containerPort: 5984
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: config
              mountPath: /opt/couchdb/etc/local.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: config-src
          configMap:
            name: obsidian-livesync-config
        - name: config
          emptyDir: {}
