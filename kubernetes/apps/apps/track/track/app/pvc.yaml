---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: track-data
  labels:
    app: track
    component: api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-storage
  dataSourceRef:
    kind: ReplicationDestination
    apiGroup: volsync.backube
    name: track-restore
  resources:
    requests:
      storage: 1Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
# Added after the first track-backup existed (an RD created before that initialises
# an empty restic repo and stays empty). restore-once is one-shot: to refresh,
# delete the RD and let Flux recreate it.
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: track-restore
spec:
  trigger:
    manual: restore-once
  restic:
    repository: restic-track
    storageClassName: longhorn-storage
    accessModes: ["ReadWriteOnce"]
    copyMethod: Snapshot
    capacity: 1Gi
    enableFileDeletion: false
    cleanupCachePVC: false
    cleanupTempPVC: false
