---
# Source: nextcloud/charts/redis/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-redis-configuration
  labels:
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: redis
data:
  redis.conf: |-
    appendonly yes
    save ""
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
  master.conf: |-
    dir /data
  replica.conf: |-
    dir /data
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
---
# Source: nextcloud/charts/redis/templates/health-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-redis-health
  labels:
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: redis
data:
  ping_readiness_local.sh: |
    #!/bin/bash
    response=$(timeout -s 15 $1 redis-cli -h localhost -p $REDIS_PORT ping)
    if [ "$?" -eq "124" ]; then echo "Timed out"; exit 1; fi
    if [ "$response" != "PONG" ]; then echo "$response"; exit 1; fi
  ping_liveness_local.sh: |
    #!/bin/bash
    response=$(timeout -s 15 $1 redis-cli -h localhost -p $REDIS_PORT ping)
    if [ "$?" -eq "124" ]; then echo "Timed out"; exit 1; fi
    responseFirstWord=$(echo $response | head -n1 | awk '{print $1;}')
    if [ "$response" != "PONG" ] && [ "$responseFirstWord" != "LOADING" ] && [ "$responseFirstWord" != "MASTERDOWN" ]; then echo "$response"; exit 1; fi
  ping_readiness_master.sh: |
    #!/bin/bash
    response=$(timeout -s 15 $1 redis-cli -h $REDIS_MASTER_HOST -p $REDIS_MASTER_PORT_NUMBER ping)
    if [ "$?" -eq "124" ]; then echo "Timed out"; exit 1; fi
    if [ "$response" != "PONG" ]; then echo "$response"; exit 1; fi
  ping_liveness_master.sh: |
    #!/bin/bash
    response=$(timeout -s 15 $1 redis-cli -h $REDIS_MASTER_HOST -p $REDIS_MASTER_PORT_NUMBER ping)
    if [ "$?" -eq "124" ]; then echo "Timed out"; exit 1; fi
    responseFirstWord=$(echo $response | head -n1 | awk '{print $1;}')
    if [ "$response" != "PONG" ] && [ "$responseFirstWord" != "LOADING" ]; then echo "$response"; exit 1; fi
  ping_readiness_local_and_master.sh: |
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_readiness_local.sh" $1 || exit_status=$?
    "$script_dir/ping_readiness_master.sh" $1 || exit_status=$?
    exit $exit_status
  ping_liveness_local_and_master.sh: |
    script_dir="$(dirname "$0")"
    exit_status=0
    "$script_dir/ping_liveness_local.sh" $1 || exit_status=$?
    "$script_dir/ping_liveness_master.sh" $1 || exit_status=$?
    exit $exit_status
---
# Source: nextcloud/charts/redis/templates/scripts-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-redis-scripts
  labels:
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/name: redis
data:
  start-master.sh: |
    #!/bin/bash
    if [[ -f /opt/bitnami/redis/mounted-etc/master.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/master.conf /opt/bitnami/redis/etc/master.conf
    fi
    if [[ -f /opt/bitnami/redis/mounted-etc/redis.conf ]];then
        cp /opt/bitnami/redis/mounted-etc/redis.conf /opt/bitnami/redis/etc/redis.conf
    fi
    ARGS=("--port" "${REDIS_PORT}")
    ARGS+=("--protected-mode" "no")
    ARGS+=("--include" "/opt/bitnami/redis/etc/redis.conf")
    ARGS+=("--include" "/opt/bitnami/redis/etc/master.conf")
    exec redis-server "${ARGS[@]}"
---
# Source: nextcloud/charts/redis/templates/master/application.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: &name nextcloud-redis-master
  labels:
    app: *name
spec:
  replicas: 1
  selector:
    matchLabels:
      app: *name
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: *name
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
          args:
            - -c
            - /opt/bitnami/scripts/start-scripts/start-master.sh
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: REDIS_REPLICATION_MODE
              value: master
            - name: ALLOW_EMPTY_PASSWORD
              value: "yes"
            - name: REDIS_TLS_ENABLED
              value: "no"
            - name: REDIS_PORT
              value: "6379"
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 6
            successThreshold: 1
            failureThreshold: 5
            exec:
              command:
                - sh
                - -c
                - /health/ping_liveness_local.sh 5
          readinessProbe:
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 5
            exec:
              command:
                - sh
                - -c
                - /health/ping_readiness_local.sh 1
          resources:
            limits:
              cpu: 500m
              ephemeral-storage: 1024Mi
              memory: 192Mi
            requests:
              cpu: 100m
              ephemeral-storage: 50Mi
              memory: 128Mi
          volumeMounts:
            - name: start-scripts
              mountPath: /opt/bitnami/scripts/start-scripts
            - name: health
              mountPath: /health
            - name: redis-data
              mountPath: /data
            - name: config
              mountPath: /opt/bitnami/redis/mounted-etc
            - name: empty-dir
              mountPath: /opt/bitnami/redis/etc/
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
      volumes:
        - name: start-scripts
          configMap:
            name: nextcloud-redis-scripts
            defaultMode: 0755
        - name: health
          configMap:
            name: nextcloud-redis-health
            defaultMode: 0755
        - name: config
          configMap:
            name: nextcloud-redis-configuration
        - name: empty-dir
          emptyDir: {}
        - name: redis-data
          persistentVolumeClaim:
            claimName: nextcloud-redis-data
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: &name nextcloud-redis-data
  labels:
    app: *name
spec:
  storageClassName: longhorn-storage
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: &name nextcloud-redis-master
  labels:
    app: *name
spec:
  ports:
  - name: tcp-redis
    port: 6379
    protocol: TCP
    targetPort: redis
  selector:
    app: *name
  type: ClusterIP
