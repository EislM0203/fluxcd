---
# dsh (deepseek-harness) web UI. Runs in its own Kata VM (nodes rke2-node-1/-3,
# picked by the RuntimeClass): agent code and tools never share the node kernel.
# The VM gets the memory limit as RAM and 1 + the CPU limit as vCPUs (3 here).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsh
  labels:
    app: dsh
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dsh
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dsh
        app: dsh
    spec:
      runtimeClassName: kata
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch   # Longhorn: else the volumes come up root-owned
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dsh
          # Built in traunseenet-lab/dsh (fj + bot git config). Pin tag AND digest;
          # Renovate opens PRs for new vX.Y.Z releases (library/* pulls anonymously).
          image: harbor.cloud.traunseenet.com/library/dsh:0.1.0@sha256:cc975778289f1125ad39763207666e1f0fdcb3e45a9c05208c5e5688f0d52a51
          imagePullPolicy: IfNotPresent
          # Entrypoint is `dsh`. No auth of its own: oauth2-proxy (httproute.yaml) is the gate.
          args: ["--profile", "web", "--no-auth", "--host", "0.0.0.0", "--no-open"]
          stdin: true
          tty: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # git reads the bot's credentials from /home/node/.dsh (the image's
            # /etc/gitconfig); this file must not set user.* (it would override the bot).
            - name: GIT_CONFIG_GLOBAL
              value: /home/node/.dsh/gitconfig
            - name: DSH_DESKTOP_ENABLED
              value: "0"
            # Bifrost virtual key, from Vault secret/ai/dsh via the ExternalSecret
            - name: BIFROST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dsh
                  key: BIFROST_VK
            # mdmem owner API token for the Memory panel plugin (its config tokenEnv).
            # Same value as API_TOKEN in secret/apps/mdmem. Optional, so the pod still
            # starts before the key exists; the panel then answers 503.
            - name: MDMEM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dsh
                  key: MDMEM_API_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 3080
          volumeMounts:
            - name: data
              mountPath: /home/node/.dsh
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dsh-data
        - name: workspace
          persistentVolumeClaim:
            claimName: dsh-workspace
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
