---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dsh
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dsh
  dataFrom:
    # KV-v2 mount is `secret`, so this reads secret/ai/dsh: BIFROST_API_KEY
    - extract:
        key: ai/dsh
