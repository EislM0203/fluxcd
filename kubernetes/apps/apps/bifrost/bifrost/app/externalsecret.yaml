---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bifrost
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bifrost
    # Merge: keys from apps/bifrost pass through unchanged, the template only adds
    # FORGEJO_AUTH_HEADER for the forgejo MCP client in config.json.
    template:
      mergePolicy: Merge
      data:
        FORGEJO_AUTH_HEADER: "token {{ .FORGEJO_MCP_TOKEN }}"
  data:
    # read-only, non-admin bot (mcp-reader-bot)
    - secretKey: FORGEJO_MCP_TOKEN
      remoteRef:
        key: apps/mcp/forgejo
        property: FORGEJO_ACCESS_TOKEN
  dataFrom:
    - extract:
        key: apps/bifrost
