---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless-tika
  name: paperless-tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-tika
  template:
    metadata:
      labels:
        app: paperless-tika
        app.kubernetes.io/part-of: paperless
    spec:
      containers:
        - image: harbor.cloud.traunseenet.com/docker.io/apache/tika:3.3.3.1@sha256:3049611264bb18cf66e6629f59818cad75ea5d46f770c504ae46537949838c67
          name: tika
          env:
            # Java4Shell (CVE-2026-114938): node-1 exposes avx512vbmi; drop once the image ships a fixed JDK.
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:-UseBASE64Intrinsics"
          ports:
            - containerPort: 9998
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-tika
spec:
  ports:
    - port: 9998
      protocol: TCP
      targetPort: 9998
  selector:
    app: paperless-tika
  type: ClusterIP
