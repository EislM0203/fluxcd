---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ntfy
  annotations:
    # Required by ValidatingAdmissionPolicy httproute-public-edge:
    # the ntfy app can't do oauth2-proxy's browser flow. ntfy enforces its own
    # auth (NTFY_DEFAULT_ACCESS deny-all); AppSec + CrowdSec in front.
    edge.traunseenet.com/public-unauthenticated: "Push notifications for phone app (native basic auth, deny-all default)"
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
    # Public via the edge (VPS -> home VM -> traefik-public); DNS by external-dns-public.
    - name: traefik-public
      namespace: networking
      sectionName: websecure-public
  hostnames:
    - ntfy.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ntfy
          port: 80
