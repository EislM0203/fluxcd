---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-lvm
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: local.csi.openebs.io
parameters:
  storage: lvm
  volgroup: lvmvg
  thinProvision: "yes"
  fsType: ext4
reclaimPolicy: Delete
allowVolumeExpansion: true
# The volume lives on whichever node the first consumer lands on; the chart's
# storage capacity tracking keeps the scheduler off nodes where it cannot fit.
volumeBindingMode: WaitForFirstConsumer
