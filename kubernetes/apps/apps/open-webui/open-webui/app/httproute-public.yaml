---
# Public via the edge (VPS -> home VM -> traefik-public), gated by oauth2-proxy.
# Separate from httproute.yaml so LAN access (gateway traefik) stays ungated.
# DNS: external-dns-public (Cloudflare A -> VPS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openwebui-public
spec:
  parentRefs:
    - name: traefik-public
      namespace: networking
      sectionName: websecure-public
  hostnames:
    - gpt.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-openwebui
      backendRefs:
        - name: open-webui
          port: 8080
