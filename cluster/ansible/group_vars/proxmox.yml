---
rke2_version: "v1.36.5+rke2r1"
# Debian 13 ships only python3; pinning it silences interpreter discovery.
ansible_python_interpreter: /usr/bin/python3

# Static /etc/hosts entries applied to every node by
# infra/bootstrap/configure-hosts-file.yml
static_host_entries:
  - ip: 10.0.0.50
    hostnames:
      - harbor.cloud.traunseenet.com
