---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fin
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - fin.cloud.traunseenet.com
  rules:
    # longest-prefix wins automatically in Gateway API — /api before /
    # Both rules behind Pocket ID (middleware-oauth2.yaml): no login in the app itself.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-fin
      backendRefs:
        - name: fin-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-fin
      backendRefs:
        - name: fin-web
          port: 80
