---
# Vault secret/apps/actual-budget: ACTUAL_OPENID_CLIENT_ID, ACTUAL_OPENID_CLIENT_SECRET
# (Pocket ID client "actual-budget"). The restic credentials stay in secret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: actual-budget-oidc
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: actual-budget-oidc
  dataFrom:
    - extract:
        key: apps/actual-budget
