apiVersion: v1
data:
  AIOHTTP_CLIENT_TIMEOUT_OPENAI_MODEL_LIST: "10"
  ENABLE_OAUTH_SIGNUP: "true"
  ENABLE_OTEL: "true"
  ENABLE_OTEL_TRACES: "true"
  ENABLE_OTEL_METRICS: "true"
  ENABLE_OTEL_LOGS: "true"
  ENABLE_WEB_SEARCH: "true"
  ENABLE_SIGNUP: "false"
  ENABLE_OPENAI_API: "true"
  ENABLE_OLLAMA_API: "false"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_SUBAGENTS: "true"
  # Summarize older messages once a chat passes the threshold (keeps the newest 40%).
  # Strata's window is 229376 (kv-grow, 2026-10-29), and the summary request carries the
  # compacted messages, so the threshold has to stay well below it.
  # PersistentConfig: these env values only seed keys that are not in the database yet;
  # once stored, change them in Admin Panel > Settings instead.
  ENABLE_CONTEXT_COMPACTION: "true"
  CONTEXT_COMPACTION_TOKEN_THRESHOLD: "170000"
  OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
  # LLM traffic is routed through the Bifrost AI gateway (OpenAI-compatible /v1).
  # Bifrost fronts llama-swap (10.0.0.59:9000) and applies OTel + MCP server-side.
  OPENAI_API_BASE_URL: "http://bifrost.apps.svc.cluster.local:8080/v1"
  OAUTH_PROVIDER_NAME: PocketID
  OAUTH_SCOPES: openid email profile
  OPENID_PROVIDER_URL: https://pocketid.cloud.traunseenet.com/.well-known/openid-configuration
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability.svc.cluster.local:4317
  OTEL_RESOURCE_ATTRIBUTES: service.name=open-webui
  OTEL_EXPORTER_OTLP_INSECURE: "true"
  # Don't trace the socket.io websocket: a browser tab left open puts every frame
  # (one span each) into a single connection trace, which grows past Tempo's 5 MB
  # max trace size within hours and gets its spans discarded (TRACE_TOO_LARGE).
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "/ws/socket\\.io"
  WEB_SEARCH_CONCURRENT_REQUESTS: "10"
  WEB_SEARCH_ENGINE: searxng
  WEB_SEARCH_RESULT_COUNT: "3"
  SEARXNG_QUERY_URL: http://searxng-web.apps.svc.cluster.local:8080/search?q=<query>
  # Image generation: sd.cpp sd-server behind llama-swap, reached through Bifrost's
  # OpenAI images API. IMAGES_OPENAI_API_KEY is the existing Bifrost virtual key and
  # arrives from vault apps/open-webui via the ExternalSecret, so it is not set here.
  ENABLE_IMAGE_GENERATION: "true"
  IMAGE_GENERATION_ENGINE: openai
  IMAGES_OPENAI_API_BASE_URL: "http://bifrost.apps.svc.cluster.local:8080/v1"
  IMAGE_GENERATION_MODEL: "llamaswap/Qwen-Image-2.1"
  IMAGE_SIZE: "1024x1024"
  # Image editing is off by default and needs its own engine/model. The edit base
  # URL and key fall back to OPENAI_API_BASE_URL / OPENAI_API_KEY, which already
  # point at Bifrost with the same virtual key, so only these four are needed.
  ENABLE_IMAGE_EDIT: "true"
  IMAGE_EDIT_ENGINE: openai
  IMAGE_EDIT_MODEL: "llamaswap/Qwen-Image-2.1"
  IMAGE_EDIT_SIZE: "1024x1024"
kind: ConfigMap
metadata:
  name: open-webui-env
---
