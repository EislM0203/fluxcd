---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mdmem
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mdmem
  dataFrom:
    # KV-v2 mount is `secret`, so this reads secret/apps/mdmem:
    #   MCP_TOKEN, BIFROST_VK, OIDC_CLIENT_SECRET, SESSION_SECRET
    - extract:
        key: apps/mdmem
