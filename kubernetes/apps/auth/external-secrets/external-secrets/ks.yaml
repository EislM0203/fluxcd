---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-app
  namespace: flux-system
spec:
  dependsOn:
    # images are pulled through the harbor proxy cache
    - name: harbor-app
  path: ./kubernetes/apps/auth/external-secrets/external-secrets/app
  prune: true
  # wait until the CRDs are established, otherwise the SecretStores in
  # hashicorp-vault-store fail to apply on a cold cluster
  wait: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets
      namespace: auth
    - apiVersion: apps/v1
      kind: Deployment
      name: external-secrets-webhook
      namespace: auth
  interval: 15m
  retryInterval: 15m
  timeout: 15m
  targetNamespace: auth
