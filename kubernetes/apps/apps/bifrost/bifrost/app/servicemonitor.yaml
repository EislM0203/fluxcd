apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bifrost
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      honorLabels: true
      basicAuth:
        username:
          name: bifrost
          key: BIFROST_ADMIN_USERNAME
        password:
          name: bifrost
          key: BIFROST_ADMIN_PASSWORD
  namespaceSelector:
    matchNames:
      - apps
  selector:
    matchLabels:
      app: bifrost
