---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crowdsec-app
  namespace: flux-system
spec:
  dependsOn:
    # images are pulled through the harbor proxy cache
    - name: harbor-app
    # LAPI PVCs (longhorn-storage)
    - name: longhorn-addons
  path: ./kubernetes/apps/security/crowdsec/crowdsec/app
  prune: true
  wait: true
  # Suspended until app/secret.yaml exists (see app/secret.yaml.example), is
  # sops-encrypted and listed in app/kustomization.yaml. The SAME key must also
  # exist in networking (traefik/addons/secret-crowdsec-bouncer.yaml.example),
  # otherwise the public entrypoint answers 404/403 (fail-closed).
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: crowdsec
      namespace: crowdsec
  interval: 15m
  retryInterval: 15m
  timeout: 15m
  targetNamespace: crowdsec
