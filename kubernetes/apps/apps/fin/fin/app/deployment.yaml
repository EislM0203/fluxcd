---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-api
  labels:
    app: fin
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fin
      component: api
  template:
    metadata:
      labels:
        app: fin
        component: api
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: harbor.cloud.traunseenet.com/library/fin-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: sqlite:////data/fin.db
          volumeMounts:
            - name: sqlite-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: fin-sqlite-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-web
  labels:
    app: fin
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fin
      component: web
  template:
    metadata:
      labels:
        app: fin
        component: web
    spec:
      containers:
        - name: web
          image: harbor.cloud.traunseenet.com/library/fin-web:latest
          imagePullPolicy: Always
          env:
            - name: API_UPSTREAM
              value: fin-api:8000
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fin-mcp
  labels:
    app: fin
    component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fin
      component: mcp
  template:
    metadata:
      labels:
        app: fin
        component: mcp
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mcp
          image: harbor.cloud.traunseenet.com/library/fin-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: FIN_API_URL
              value: http://fin-api.apps.svc.cluster.local:8000
            - name: FIN_MCP_TRANSPORT
              value: streamable-http
            - name: FIN_MCP_HOST
              value: 0.0.0.0
            - name: FIN_MCP_PORT
              value: "8000"
            - name: FIN_MCP_PATH
              value: /mcp
            - name: FIN_MCP_ALLOW_WRITES
              value: "1"
            # FastMCP answers 421 to any Host it was not told to trust, and
            # bifrost reaches this through the Service DNS name.
            - name: FIN_MCP_ALLOWED_HOSTS
              value: "fin-mcp.apps.svc.cluster.local:*,fin-mcp:*"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
