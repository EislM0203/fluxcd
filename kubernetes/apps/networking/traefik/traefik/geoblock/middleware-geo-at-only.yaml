---
# DRAFT for phase 3 - NOT applied: no Flux Kustomization points at this dir
# (networking/traefik/kustomization.yaml only includes ./traefik/ks.yaml), and
# the geoblock plugin is NOT declared in base/release.yaml yet.
#
# Why not wired now (verified against Traefik v3.7.14 / plugin sources):
#  * Catalog plugins are unpacked to /plugins-storage/sources/gop-<random>/...
#    (pkg/plugins/manager.go: os.MkdirTemp(..., "gop-*")), so the DB bundled in
#    the plugin (seeds/IP2LOCATION-LITE-DB1.IPV6.BIN) has no stable path:
#    TRAEFIK_PLUGIN_GEOBLOCK_PATH can't be set and plugin creation fails
#    ("must be set to the plugin root"). Same for nscuro/traefik-plugin-geoblock
#    (databaseFilePath), which is also unmaintained (last release 2024-04).
#  * Any plugin that fails to download/compile at startup disables ALL plugins,
#    i.e. also the CrowdSec bouncer -> public entrypoint 404. An unattached
#    geoblock plugin would only add that risk.
# Phase 3 needs a stable DB path first, e.g. experimental.localPlugins.geoblock
# (moduleName github.com/david-garcia-garcia/traefik-geoblock, settings.useUnsafe:
# true, env TRAEFIK_PLUGIN_GEOBLOCK_PATH=/plugins-local/src/github.com/
# david-garcia-garcia/traefik-geoblock) fed by a hostPath/volume with the v1.2.1
# source tree, or experimental.plugins + a DB file mounted at the `path` below.
#
# Gateway API ExtensionRef filters only resolve Middlewares in the HTTPRoute's
# own namespace -> one copy per namespace. Usage (phase 3), in an HTTPRoute rule:
#   filters:
#     - type: ExtensionRef
#       extensionRef:
#         group: traefik.io
#         kind: Middleware
#         name: geo-at-only
#
# Client IP: remoteAddress = req.RemoteAddr (PROXY-decoded on websecure-pub,
# never taken from client headers). LAN/pod clients are PRIVATE -> allowed, so a
# route attached to both Gateways keeps working internally.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: geo-at-only
  namespace: apps          # Trek
spec:
  plugin:
    geoblock:
      mode: enrichandblock
      allowedCountries: ["AT"]
      defaultAllow: false
      allowPrivate: true
      banIfError: true
      disallowedStatusCode: 403
      ipHeaders: ["remoteAddress"]
      ipHeaderStrategy: CheckFirst
      countryHeader: X-IPCountry
      logStatusDetailHeader: X-Geoblock-Decision
      databaseSources:
        # operator-defined reserved key WITHOUT url -> no download, offline only
        default_ip2location:
          enabled: true
          databaseType: bin
          fieldsPreconfigured: ip2location_lite
          defaultFile: IP2LOCATION-LITE-DB1.IPV6.BIN
          path: /geoip/IP2LOCATION-LITE-DB1.IPV6.BIN
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: geo-at-only
  namespace: storage       # Harbor
spec:
  plugin:
    geoblock:
      mode: enrichandblock
      allowedCountries: ["AT"]
      defaultAllow: false
      allowPrivate: true
      banIfError: true
      disallowedStatusCode: 403
      ipHeaders: ["remoteAddress"]
      ipHeaderStrategy: CheckFirst
      countryHeader: X-IPCountry
      logStatusDetailHeader: X-Geoblock-Decision
      databaseSources:
        default_ip2location:
          enabled: true
          databaseType: bin
          fieldsPreconfigured: ip2location_lite
          defaultFile: IP2LOCATION-LITE-DB1.IPV6.BIN
          path: /geoip/IP2LOCATION-LITE-DB1.IPV6.BIN
