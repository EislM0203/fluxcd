apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
spec:
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
    spec:
      containers:
      - name: ntfy
        image: harbor.cloud.traunseenet.com/docker.io/binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
        args: ["serve"]
        envFrom:
        - configMapRef:
            name: ntfy
        - secretRef:
            name: ntfy-secrets
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: data
          mountPath: "/etc/ntfy"
      volumes:
        - name: data
          nfs:
            server: 10.0.0.154
            path: /mnt/nvmepool/kubernetes/ntfy
