apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  labels:
    app: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bifrost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: bifrost
        app: bifrost
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: bifrost
          image: harbor.cloud.traunseenet.com/docker.io/maximhq/bifrost:v2.3.2@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          envFrom:
            - configMapRef:
                name: bifrost-env
            - secretRef:
                name: bifrost
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data
            - name: bifrost-config
              mountPath: /app/data/config.json
              subPath: config.json
          # A first start after an upgrade runs configstore/logstore migrations and the
          # encryption pass before /health answers. Without this, liveness killed v2.1.0
          # mid-bootstrap after ~60s. Liveness/readiness only start once this succeeds.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              # ~250-400Mi steady, but bursts of MCP traffic (agent sessions) hit 1Gi and
              # OOMKilled it (2026-10-31): 503s in every chat until the restart.
              memory: 2Gi
      volumes:
        - name: bifrost-data
          persistentVolumeClaim:
            claimName: bifrost-data
        - name: bifrost-config
          configMap:
            name: bifrost-config
