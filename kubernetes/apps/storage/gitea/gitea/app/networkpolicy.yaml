# Ingress-only. Namespace comes from the Flux Kustomization's targetNamespace,
# like every other file in this directory.
#
# Three callers must survive, or this policy breaks them silently:
#   - Traefik      HTTPRoute gitea.cloud.traunseenet.com -> :3000
#   - k8s-newt     reaches the pod directly (see newt/app/k8sNetworkPolicy.yaml),
#                  NOT through Traefik, so Pangolin dies without this rule
#   - gatus        polls /api/healthz every 1m (gatus/app/cm.yaml)
#
# The deployment has no probes, so there is no kubelet path to allow.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-ingress
spec:
  podSelector:
    matchLabels:
      app: gitea
  policyTypes: ["Ingress"]
  ingress:
    # Web UI / git-over-HTTP via the gateway
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
    # Pangolin, via newt's direct pod-to-pod path
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app: k8s-newt
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 22
    # Healthcheck
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 3000
