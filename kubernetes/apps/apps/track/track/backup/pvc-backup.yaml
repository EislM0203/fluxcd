---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: track-backup
spec:
  sourcePVC: track-data
  trigger:
    # staggered: :55 is the only free slot in the 6-hourly ring
    schedule: "55 */6 * * *"
  restic:
    pruneIntervalDays: 1
    repository: restic-track
    retain:
      hourly: 5
      daily: 4
      weekly: 3
      monthly: 2
      yearly: 1
    copyMethod: Snapshot
    storageClassName: longhorn-storage
