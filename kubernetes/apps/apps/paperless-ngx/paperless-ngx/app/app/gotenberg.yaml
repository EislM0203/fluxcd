---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless-gotenberg
  name: paperless-gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gotenberg
  template:
    metadata:
      labels:
        app: paperless-gotenberg
        app.kubernetes.io/part-of: paperless
    spec:
      # Renders untrusted documents/URLs: own Kata VM instead of the node kernel.
      runtimeClassName: kata
      containers:
        - image: harbor.cloud.traunseenet.com/docker.io/gotenberg/gotenberg:8.40@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
          name: gotenberg
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          ports:
            - containerPort: 3000
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gotenberg
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: paperless-gotenberg
  type: ClusterIP
