---
# PUBLIC ONLY (traefik-public). Every public route MUST carry a forward-auth filter.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
spec:
  parentRefs:
    - name: traefik-public
      namespace: networking
      sectionName: websecure-public
  hostnames:
    - whoami.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-whoami-users
      backendRefs:
        - name: whoami
          port: 80
