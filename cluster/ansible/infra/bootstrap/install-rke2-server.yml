---
- name: Install RKE2 Kubernetes Single Node
  hosts: rke2_server
  become: yes

  tasks:
    - name: Collect all ansible_host values from inventory
      ansible.builtin.set_fact:
        all_ansible_hosts: "{{ groups['all'] | map('extract', hostvars, 'ansible_host') | list | unique }}"
      tags: [bootstrap, rke2, server, config]

    - name: Create RKE2 config directory
      ansible.builtin.file:
        path: /etc/rancher/rke2
        state: directory
        mode: '0755'
      tags: [bootstrap, rke2, server]

    - name: Create RKE2 config for single server
      ansible.builtin.template:
        src: rke2-config.yaml.j2
        dest: /etc/rancher/rke2/config.yaml
        mode: '0640'
      tags: [bootstrap, rke2, server, config]
      notify: Restart rke2-server

    - name: Create Kubernetes API audit policy
      ansible.builtin.template:
        src: rke2-audit-policy.yaml.j2
        dest: /etc/rancher/rke2/audit-policy.yaml
        mode: '0600'
      tags: [bootstrap, rke2, server, config, audit]
      notify: Restart rke2-server

    - name: Create Kubernetes API authentication config (OIDC through Pocket ID)
      ansible.builtin.template:
        src: rke2-authentication-config.yaml.j2
        dest: /etc/rancher/rke2/authentication-config.yaml
        mode: '0600'
      tags: [bootstrap, rke2, server, config, oidc]
      notify: Restart rke2-server

    - name: Install and start RKE2 server
      tags: [bootstrap, rke2, server]
      block:
        - name: Download RKE2 installer
          ansible.builtin.get_url:
            url: https://get.rke2.io
            dest: /tmp/rke2-installer.sh
            mode: '0755'

        - name: Run RKE2 installer
          ansible.builtin.command: /tmp/rke2-installer.sh
          args:
            creates: /usr/local/bin/rke2
          environment:
            INSTALL_RKE2_VERSION: "{{ rke2_version }}"

        - name: Enable and start RKE2 server
          ansible.builtin.systemd:
            name: rke2-server.service
            enabled: yes
            state: started
            daemon_reload: yes

        - name: Wait for server to be ready
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 9345
            timeout: 300

        - name: Wait for node to be in Ready state
          ansible.builtin.command: >
            /var/lib/rancher/rke2/bin/kubectl
            --kubeconfig /etc/rancher/rke2/rke2.yaml
            get nodes --no-headers
          register: ready_nodes
          until: "'Ready' in ready_nodes.stdout"
          retries: 30
          delay: 10
          changed_when: false

      rescue:
        - name: Collect RKE2 server logs on failure
          ansible.builtin.command: journalctl -u rke2-server --no-pager -n 100
          register: rke2_logs
          changed_when: false

        - name: Show failure logs
          ansible.builtin.debug:
            var: rke2_logs.stdout_lines

        - name: Fail with context
          ansible.builtin.fail:
            msg: "RKE2 server installation failed. See logs above."

    - name: Display cluster status
      ansible.builtin.command: >
        /var/lib/rancher/rke2/bin/kubectl
        --kubeconfig /etc/rancher/rke2/rke2.yaml
        get nodes
      register: cluster_status
      changed_when: false
      tags: [bootstrap, rke2, server, status]

    - name: Show cluster information
      ansible.builtin.debug:
        var: cluster_status.stdout_lines
      tags: [bootstrap, rke2, server, status]

    - name: Read original kubeconfig
      ansible.builtin.slurp:
        src: /etc/rancher/rke2/rke2.yaml
      register: kubeconfig_content
      tags: [bootstrap, rke2, server, kubeconfig]

    # Only for bootstrap.sh (sets RKE2_BOOTSTRAP=1 and deletes the file when done):
    # Flux has to be installed before Pocket ID runs. Otherwise no admin client
    # certificate on the PC; break-glass is /etc/rancher/rke2/rke2.yaml on the server.
    - name: Save admin kubeconfig locally for the Flux bootstrap
      when: lookup('env', 'RKE2_BOOTSTRAP') == '1'
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: "{{ (kubeconfig_content.content | b64decode).replace('https://127.0.0.1:6443', 'https://' + ansible_host + ':6443') }}"
        dest: "{{ lookup('env', 'HOME') }}/.kube/rke2-admin.yaml"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'USER') }}"
        mode: '0600'
      tags: [bootstrap, rke2, server, kubeconfig]

    # Daily kubeconfig: no credentials in it, kubelogin fetches a Pocket ID token
    # (browser + passkey) and caches it. Needs the kubectl plugin kubelogin.
    - name: Save OIDC kubeconfig as the default kubeconfig
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: |
          apiVersion: v1
          kind: Config
          clusters:
            - name: rke2
              cluster:
                server: https://{{ ansible_host }}:6443
                certificate-authority-data: {{ (kubeconfig_content.content | b64decode | from_yaml).clusters[0].cluster['certificate-authority-data'] }}
          users:
            - name: oidc
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: kubectl
                  args:
                    - oidc-login
                    - get-token
                    - --oidc-issuer-url={{ rke2_oidc_issuer_url }}
                    - --oidc-client-id={{ rke2_oidc_client_id }}
                    # preferred_username comes with profile, the group list with groups
                    - --oidc-extra-scope=profile
                    - --oidc-extra-scope=groups
                  interactiveMode: IfAvailable
            # For SSH sessions without a local browser (e.g. from the phone): prints a
            # Pocket ID URL + code to confirm on any device.
            - name: oidc-device
              user:
                exec:
                  apiVersion: client.authentication.k8s.io/v1
                  command: kubectl
                  args:
                    - oidc-login
                    - get-token
                    - --oidc-issuer-url={{ rke2_oidc_issuer_url }}
                    - --oidc-client-id={{ rke2_oidc_client_id }}
                    - --oidc-extra-scope=profile
                    - --oidc-extra-scope=groups
                    - --grant-type=device-code
                  interactiveMode: IfAvailable
          contexts:
            - name: rke2
              context:
                cluster: rke2
                user: oidc
            - name: rke2-device
              context:
                cluster: rke2
                user: oidc-device
          current-context: rke2
        dest: "{{ lookup('env', 'HOME') }}/.kube/config"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'USER') }}"
        mode: '0600'
      tags: [bootstrap, rke2, server, kubeconfig]

  handlers:
    # Restarts the control plane (API down ~1-2 min; running pods are unaffected).
    # Only fires when the config or audit policy actually changed.
    - name: Restart rke2-server
      ansible.builtin.systemd:
        name: rke2-server.service
        state: restarted
