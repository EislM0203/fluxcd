# Login is the app's own (Dashboard accounts), so this route is the only front door:
# no HTTPRoute on :3001 (metrics) — scraped in-cluster by kube-prometheus.
# With no space bound to / yet, opening / redirects to /.dashboard for the
# first-run setup wizard; after setup the space is served at / with no restart.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: silverbullet
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - silverbullet.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: silverbullet
          port: 3000
