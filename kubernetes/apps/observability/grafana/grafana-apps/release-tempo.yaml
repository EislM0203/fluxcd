---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-tempo
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: tempo
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicas: 1
    # Tempo 3 (chart 3.x): the chart's own config template replaces the custom
    # one, which still carried the removed ingester/compactor/traces_storage
    # blocks. Retention now renders into backend_scheduler.
    tempo:
      reportingEnabled: false
      streamOverHttpEnabled: true
      retention: 12h
      overrides:
        defaults:
          metrics_generator:
            # local-blocks is not supported by Tempo 3
            processors:
              - service-graphs
              - span-metrics
      metricsGenerator:
        # -- If true, enables Tempo's metrics generator (https://grafana.com/docs/tempo/next/metrics-generator/)
        enabled: true
        remoteWriteUrl: "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
    # # this is jaeger
    # # tempoQuery:
    # #   enabled: true
    # #   ingress:
    # #     enabled: true
    # #     className: traefik
    # #     hosts:
    # #       - tempo-query.cloud.traunseenet.com
    # #     annotations:
    # #       traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # #       cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # #     labels:
    # #       app: signoz
    # #     tls:
    # #       - secretName: tempo-cert
    # #         hosts:
    # #           - tempo-query.cloud.traunseenet.com
      # extraVolumeMounts:
      #   - name: tempo-pvc
      #     mountPath: /mnt/volume
      #     existingClaim: tempo-pvc
    service:
      type: ClusterIP
    # persistence:
    #   enabled: true
    #   storageClassName: longhorn-storage
    #   accessModes:
    #     - ReadWriteOnce
    #   size: 2Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: grafanadatasource-tempo
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: tempo
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://grafana-tempo.observability.svc.cluster.local:3200
    jsonData:
      tracesToMetrics:
        spanEndTimeShift: 1h
        spanStartTimeShift: "-1h"
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        customQuery: false
        spanStartTimeShift: "-1h"
        datasourceUid: loki
        spanEndTimeShift: 1h
      streamingEnabled:
        search: true
        metrics: true
      traceQuery:
        timeShiftEnabled: false
        spanStartTimeShift: ""