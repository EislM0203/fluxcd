---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  labels:
    app: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO data volume
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
        app.kubernetes.io/part-of: forgejo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forgejo
          image: code.forgejo.org/forgejo/forgejo:16.0.7-rootless@sha256:85c09de612c60347d3d44582ca8cb32e7ac46309a544e35b2cb27dad2e5ad5bd
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: forgejo-env
          env:
            - name: FORGEJO__database__HOST
              valueFrom: {secretKeyRef: {name: forgejo-pg-app, key: host}}
            - name: FORGEJO__database__NAME
              valueFrom: {secretKeyRef: {name: forgejo-pg-app, key: dbname}}
            - name: FORGEJO__database__USER
              valueFrom: {secretKeyRef: {name: forgejo-pg-app, key: username}}
            - name: FORGEJO__database__PASSWD
              valueFrom: {secretKeyRef: {name: forgejo-pg-app, key: password}}
            - name: FORGEJO__security__SECRET_KEY
              valueFrom: {secretKeyRef: {name: forgejo-secrets, key: SECRET_KEY}}
            - name: FORGEJO__security__INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: forgejo-secrets, key: INTERNAL_TOKEN}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-data
        - name: tmp
          emptyDir: {}
