---
apiVersion: v1
kind: Service
metadata:
  name: track-api
  labels:
    app: track
    component: api
spec:
  type: ClusterIP
  selector:
    app: track
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: track-web
  labels:
    app: track
    component: web
spec:
  type: ClusterIP
  selector:
    app: track
    component: web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: track-mcp
  labels:
    app: track
    component: mcp
spec:
  type: ClusterIP
  selector:
    app: track
    component: mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
