---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 15m
  chart:
    spec:
      chart: cert-manager
      # Reverted from v1.21.1: the v1.21.1 webhook binary crashloops here with a
      # Go runtime "fatal error: freeIndex is not valid" (heap corruption), leaving
      # the webhook Service with no endpoints -> ClusterIssuer validation fails ->
      # cert-manager-addons blocked -> cascades to traefik-base, immich, karakeep.
      # Controller + cainjector (same build/node) are fine, so it's webhook-specific.
      # TODO: retry a newer patch (>=v1.21.2) once available and confirm webhook stays up.
      version: v1.21.1
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    installCRDs: true
    crds:
      enabled: true
    replicaCount: 1
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    # extraArgs:
    #   - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
