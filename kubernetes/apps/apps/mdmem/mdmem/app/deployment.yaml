---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdmem
  labels:
    app: mdmem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mdmem
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: mdmem
        app: mdmem
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch   # Longhorn: else /data comes up root-owned
      containers:
        - name: mdmem
          # Pin tag AND digest. Renovate opens PRs for new vX.Y.Z releases
          # (library/* pulls anonymously).
          image: harbor.cloud.traunseenet.com/library/mdmem:0.7.0@sha256:d06e09fd5835866dee5184224fcf13aa8db8626f3cb0d0da819d1baa8a238d31
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp
          envFrom:
            - configMapRef:
                name: mdmem-env
            - secretRef:
                name: mdmem          # from Vault via the ExternalSecret
          ports:
            - name: mcp
              containerPort: 8080
            - name: ui
              containerPort: 8081
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: repos
              mountPath: /config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: ui
            initialDelaySeconds: 30
            periodSeconds: 30
          startupProbe:
            httpGet:
              path: /healthz
              port: ui
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz          # never checks Bifrost (§14.17)
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mdmem-data
        - name: tmp
          emptyDir: {}
        - name: repos
          configMap:
            name: mdmem-repos    # anchor registry (REPOS_FILE) + tag vocabulary (TAGS_FILE)
