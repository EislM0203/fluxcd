---
# Volume group for OpenEBS LVM LocalPV on the dedicated data disk (scsi1, set via
# data_disk_size in cluster/tf). Nodes without that disk are skipped, so this is
# safe to run against the whole cluster. Also creates or grows <vg>_thinpool, the
# pool OpenEBS uses for StorageClasses with thinProvision: "yes".
- name: Prepare nodes for OpenEBS LVM LocalPV
  hosts: rke2_server:rke2_agents
  become: yes

  vars:
    openebs_lvm_vg: lvmvg
    # Proxmox exposes the VM's scsi1 under a stable by-id name, unlike /dev/sdX
    openebs_lvm_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
    # generous for a pool of up to a few hundred GiB with many snapshots
    openebs_lvm_meta_mib: 512

  tasks:
    - name: Install LVM and thin provisioning tools
      ansible.builtin.apt:
        name:
          - lvm2
          - thin-provisioning-tools
        state: present
        update_cache: yes
      tags: [bootstrap, openebs, packages]

    - name: Load device-mapper snapshot and thin pool modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop: [dm_snapshot, dm_thin_pool]
      tags: [bootstrap, openebs, modules]

    - name: Load device-mapper modules at boot
      ansible.builtin.copy:
        dest: /etc/modules-load.d/openebs-lvm.conf
        content: |
          dm_snapshot
          dm_thin_pool
        mode: "0644"
      tags: [bootstrap, openebs, modules]

    - name: Look for the data disk
      ansible.builtin.stat:
        path: "{{ openebs_lvm_disk }}"
      register: data_disk
      tags: [bootstrap, openebs, lvm]

    # No force: if the disk already carries a filesystem or another VG, this fails
    # instead of wiping it.
    - name: Create the volume group on the data disk
      community.general.lvg:
        vg: "{{ openebs_lvm_vg }}"
        pvs: "{{ openebs_lvm_disk }}"
        state: present
      when: data_disk.stat.exists
      tags: [bootstrap, openebs, lvm]

    # Left alone, OpenEBS creates <vg>_thinpool sized to the first PVC (1 GiB on the
    # test) with LVM autoextend off, so the pool runs full long before the disk does.
    # Pre-size it to 90% of the VG instead; the rest covers the metadata spare.
    - name: Read the volume group and thin pool sizes
      ansible.builtin.command: >-
        lvs --noheadings --units b --nosuffix --separator ,
        -o vg_size,lv_size,lv_metadata_size {{ openebs_lvm_vg }}/{{ openebs_lvm_vg }}_thinpool
      register: thinpool
      changed_when: false
      failed_when: false
      when: data_disk.stat.exists
      tags: [bootstrap, openebs, lvm]

    - name: Create the thin pool
      ansible.builtin.command: >-
        lvcreate --type thin-pool -l 90%VG --poolmetadatasize {{ openebs_lvm_meta_mib }}M
        -n {{ openebs_lvm_vg }}_thinpool {{ openebs_lvm_vg }}
      when: data_disk.stat.exists and thinpool.rc != 0
      tags: [bootstrap, openebs, lvm]

    # Metadata first: it needs free extents, and the data extend below takes them.
    - name: Grow the thin pool metadata
      ansible.builtin.command: >-
        lvextend --poolmetadatasize {{ openebs_lvm_meta_mib }}M
        {{ openebs_lvm_vg }}/{{ openebs_lvm_vg }}_thinpool
      when:
        - data_disk.stat.exists and thinpool.rc == 0
        - (thinpool.stdout.split(',')[2] | trim | int) < openebs_lvm_meta_mib * 1048576
      tags: [bootstrap, openebs, lvm]

    - name: Grow the thin pool to 90% of the volume group
      ansible.builtin.command: lvextend -l 90%VG {{ openebs_lvm_vg }}/{{ openebs_lvm_vg }}_thinpool
      when:
        - data_disk.stat.exists and thinpool.rc == 0
        - (thinpool.stdout.split(',')[1] | trim | int) < (thinpool.stdout.split(',')[0] | trim | int) * 0.85
      tags: [bootstrap, openebs, lvm]

    - name: Report nodes without a data disk
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: no {{ openebs_lvm_disk }}, skipped the volume group"
      when: not data_disk.stat.exists
      tags: [bootstrap, openebs, lvm]
