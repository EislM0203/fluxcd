---
# Ingress-only: Traefik (both gateways share the same pods), Gatus, and the
# Actions runner namespace (autoscaler API calls + runner task fetch/report).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-ingress
spec:
  podSelector:
    matchLabels:
      app: forgejo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgejo-runners
      ports:
        - protocol: TCP
          port: 3000
---
# CNPG cluster forgejo-pg: the app on 5432, its own instances (replication, instance manager),
# the CNPG operator (instance manager API :8000; without it the cluster looks unhealthy
# and cannot be managed) and Prometheus (PodMonitor :9187, CNPG alerts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-pg-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: forgejo-pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: forgejo
        - podSelector:
            matchLabels:
              app: forgejo-oidc
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: forgejo-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
