---
# Ping URL of the external dead man's switch (healthchecks.io check). It is a
# credential: whoever has it can fake "alive". Mounted into Alertmanager at
# /etc/alertmanager/secrets/alertmanager-deadmans-switch/url.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-deadmans-switch
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-deadmans-switch
  data:
    - secretKey: url
      remoteRef:
        key: observability/alertmanager
        property: DEADMANS_SWITCH_URL
