---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fin
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - fin.cloud.traunseenet.com
  rules:
    # longest-prefix wins automatically in Gateway API — /api before /
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: fin-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: fin-web
          port: 80
