---
# Ingress-only, same as github-mcp: called by Bifrost only. The server holds no
# token (Bifrost sends it per request), but it would relay any token it is handed,
# so the network stays the gate. Kubelet probes come from the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forgejo-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app: forgejo-mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:
            matchLabels:
              app: bifrost
      ports:
        - protocol: TCP
          port: 8080
