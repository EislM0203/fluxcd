---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-secrets
spec:
  groups:
    # External Secrets Operator (auth/external-secrets) syncing from Vault. A failing sync
    # keeps the old Kubernetes Secret, so apps only break later (rotation, restart, new app).
    # `exported_namespace` is the ExternalSecret's namespace, `namespace` the operator's.
    - name: external-secrets
      rules:
        - alert: SecretStoreNotReady
          # Usually Vault sealed or unreachable, or its Kubernetes auth role broken:
          # every ExternalSecret behind this store stops syncing.
          expr: >-
            clustersecretstore_status_condition{condition="Ready", status="False"} == 1
            or secretstore_status_condition{condition="Ready", status="False"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Secret store {{ $labels.name }} is not ready - no secrets are synced from Vault
            description: >-
              Check that Vault is unsealed and reachable, and
              `kubectl describe clustersecretstore {{ $labels.name }}`.
        - alert: ExternalSecretNotSynced
          expr: externalsecret_status_condition{condition="Ready", status="False"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} is not syncing
            description: >-
              The Kubernetes Secret keeps its last value. Check
              `kubectl -n {{ $labels.exported_namespace }} describe externalsecret {{ $labels.name }}`
              (missing Vault path or key, permissions).
        - alert: ExternalSecretsMetricsMissing
          # If the operator is gone there is nothing to scrape, and neither the rules above
          # nor TargetDown fire.
          expr: absent(externalsecret_status_condition)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No External Secrets metrics - the operator may be down
            description: Check `kubectl -n auth get pods -l app.kubernetes.io/name=external-secrets`.
