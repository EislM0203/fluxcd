---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager
spec:
  groups:
    - name: cert-manager
      rules:
        - alert: CertificateExpiringSoon
          # cert-manager renews 30 days before expiry by default; under 14 days left
          # means renewal has been failing for over two weeks.
          expr: min by (exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 86400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}
            description: Renewal is not succeeding. Check `kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}`.
        - alert: CertificateNotReady
          expr: max by (exported_namespace, name) (certmanager_certificate_ready_status{condition="False"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not ready
            description: Check `kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}`.
