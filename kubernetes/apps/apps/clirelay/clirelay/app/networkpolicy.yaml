# Every backend reachable only from its own clients (podSelector: Calico evaluates
# after DNAT, so never select by Service IP). Kubelet probes come from the node and are
# not affected.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clirelay-ingress
spec:
  podSelector:
    matchLabels:
      app: clirelay
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: bifrost
      ports:
        - protocol: TCP
          port: 8317
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clirelay-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: clirelay-redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clirelay
      ports:
        - protocol: TCP
          port: 6379
---
# CNPG cluster clirelay-pg: the app on 5432, its own instances (replication, instance
# manager), the CNPG operator (instance manager API :8000; without it the cluster looks
# unhealthy and cannot be managed) and Prometheus (PodMonitor :9187, CNPG alerts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clirelay-pg-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: clirelay-pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: clirelay
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: clirelay-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
