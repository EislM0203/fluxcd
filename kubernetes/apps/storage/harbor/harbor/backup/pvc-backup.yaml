
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationsource_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name:  harbor-backup
spec:
  sourcePVC: harbor-data
  trigger:
    schedule: "50 */10 * * *"
  restic:
    pruneIntervalDays: 1
    repository: restic-harbor
    retain:
      hourly: 5
      daily: 4
      weekly: 3
      monthly: 2
      yearly: 1
    copyMethod: Snapshot
    # The snapshot clone always lands on node-2 next to harbor-data, but the
    # restic cache follows this class too; with the generic class the scheduler
    # put the cache on another node and the mover could not start.
    storageClassName: openebs-lvm-rke2-node-2
    unlock: "something"
