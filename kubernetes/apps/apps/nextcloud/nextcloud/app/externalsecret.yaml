---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nextcloud-admin
  dataFrom:
    - extract:
        key: apps/nextcloud
---
# Vault apps/eurooffice must hold JWT_SECRET (>= 32 random chars); shared by the Document Server and Nextcloud
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eurooffice
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eurooffice
  dataFrom:
    - extract:
        key: apps/eurooffice
