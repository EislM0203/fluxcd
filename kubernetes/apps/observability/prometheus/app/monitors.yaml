---
# Flux controller metrics (reconcile durations, controller-runtime, workqueues),
# as in Flux's flux2-monitoring-example. Reconcile status itself comes from
# kube-state-metrics (gotk_resource_info).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - helm-controller
          - source-controller
          - source-watcher
          - kustomize-controller
          - notification-controller
          - image-automation-controller
          - image-reflector-controller
  podMetricsEndpoints:
    - port: http-prom
---
# OpenTelemetry collector self-metrics (otelcol_*: accepted/refused/sent/failed, queues),
# served on :8888 by the operator-created monitoring Service.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: opentelemetry-collector
  namespace: observability
spec:
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      operator.opentelemetry.io/collector-service-type: monitoring
  endpoints:
    - port: monitoring
