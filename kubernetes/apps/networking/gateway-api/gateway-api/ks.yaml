---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  path: ./config/crd/standard
  # NEVER prune CRDs — deleting them cascades to every Gateway/HTTPRoute object
  prune: false
  # block dependents (traefik-base) until the CRDs are Established
  wait: true
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: flux-system
  interval: 30m
  retryInterval: 15m
  timeout: 5m
