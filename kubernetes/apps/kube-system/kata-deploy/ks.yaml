---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kata-deploy
  namespace: flux-system
spec:
  path: ./kubernetes/apps/kube-system/kata-deploy/app
  prune: true
  wait: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 5m
  # First install restarts the RKE2 agent on each selected node.
  timeout: 20m
  targetNamespace: kube-system
