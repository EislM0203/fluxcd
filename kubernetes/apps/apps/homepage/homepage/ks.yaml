---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage-app
  namespace: flux-system
spec:
  # No PVC: the whole config lives in the SOPS secret and the log directory is
  # an emptyDir, so neither longhorn-addons nor volsync are needed here.
  dependsOn:
    - name: cert-manager-addons
    - name: traefik-base
    - name: harbor-app
  path: ./kubernetes/apps/apps/homepage/homepage/app
  prune: true
  wait: true
  suspend: false
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: homepage
      namespace: apps
  interval: 15m
  retryInterval: 15m
  timeout: 15m
  targetNamespace: apps
