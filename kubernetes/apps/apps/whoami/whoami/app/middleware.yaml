---
# Forward-auth via the shared oauth2-proxy (auth namespace).
#
# Pattern: ONE Middleware per (namespace, allowed group set).
#  - Gateway API ExtensionRef is a LocalObjectReference: an HTTPRoute can only
#    use a Middleware in its OWN namespace, so every app namespace needs a copy.
#  - Authorization is the allowed_groups query parameter (comma-separated, any
#    match wins; allowed_emails= also works). Not logged in -> 302 to Pocket ID;
#    logged in but not in the group -> 403.
#  - Address is oauth2-proxy's "/" endpoint (static://202 upstream + skip-provider-button),
#    not /oauth2/auth: /oauth2/auth only returns 401, which would need an extra
#    Traefik `errors` middleware + Service in this namespace to redirect.
#
# Pocket ID: create group "whoami_users", add the user(s) (they must ALSO be
# in the global "edge_users" group), and make sure the oauth2-proxy OIDC
# client gets the groups claim (scope "groups").
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-forward-auth-whoami-users
spec:
  forwardAuth:
    address: http://oauth2-proxy.auth.svc.cluster.local:4180/?allowed_groups=whoami_users
    # Don't pass client-supplied X-Forwarded-* through to the auth server;
    # Traefik sets them itself from the (PROXY-decoded) connection.
    trustForwardHeader: false
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Groups
    # Session refreshes (--cookie-refresh) arrive as Set-Cookie on the 202
    # auth response; without this Traefik drops them. Exact names: the base
    # cookie plus its split variants (sessions > 4 KB get _0, _1, ...).
    addAuthCookiesToResponse:
      - __Secure-oauth2-proxy
      - __Secure-oauth2-proxy_0
      - __Secure-oauth2-proxy_1
      - __Secure-oauth2-proxy_2
      - __Secure-oauth2-proxy_3
