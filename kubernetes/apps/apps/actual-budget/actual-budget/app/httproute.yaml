---
# Internal only (websecure-cloud, LAN/WG). No forward-auth: Actual logs in through
# Pocket ID itself (configmap.yaml), and its sync API must stay reachable for the app.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual-budget
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - actual.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: actual-budget
          port: 5006
