apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: gitea
        app: gitea
    spec:
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:28.1.0@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a
          ports:
            - containerPort: 3000
            - containerPort: 22
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            # Publicly reachable via the edge: no self-service accounts.
            # (environment-to-ini writes these into app.ini on start)
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"
            - name: GITEA__openid__ENABLE_OPENID_SIGNUP
              value: "false"
          volumeMounts:
            - name: gitea-data
              mountPath: /data
      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-data