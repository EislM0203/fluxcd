---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  annotations:
    # Required by ValidatingAdmissionPolicy httproute-public-edge:
    # public repos must be readable anonymously and git clients can't do
    # oauth2-proxy's browser flow. Accounts only via Pocket ID; AppSec + CrowdSec in front.
    edge.traunseenet.com/public-unauthenticated: "Public repos (anonymous read), git over HTTPS; sign-in only via Pocket ID"
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
    # Public via the edge (VPS -> home VM -> traefik-public); DNS by external-dns-public.
    - name: traefik-public
      namespace: networking
      sectionName: websecure-public
  hostnames:
    - git.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: forgejo
          port: 3000
