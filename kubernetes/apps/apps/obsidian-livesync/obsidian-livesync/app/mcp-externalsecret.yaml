---
# Vault path: apps/obsidian-mcp
# Required keys: MCP_AUTH_TOKEN, COUCHDB_PASSPHRASE
# COUCHDB_USER and COUCHDB_PASSWORD are reused from the existing
# obsidian-livesync-admin secret (apps/obsidian-livesync Vault path).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: obsidian-mcp
  dataFrom:
    - extract:
        key: apps/obsidian-mcp
