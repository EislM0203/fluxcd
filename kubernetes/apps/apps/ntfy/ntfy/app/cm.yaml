apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy
data:
  NTFY_BASE_URL: "https://ntfy.cloud.traunseenet.com"
  NTFY_BEHIND_PROXY: "true"
  NTFY_PROXY_FORWARDED_HEADER: "X-Forwarded-For"
  NTFY_CACHE_FILE: "/etc/ntfy/cache/cache.db"
  NTFY_CACHE_DURATION: "12h"
  NTFY_AUTH_FILE: "/etc/ntfy/auth/auth.db"
  # Public via the edge: nobody reads or writes without login...
  NTFY_AUTH_DEFAULT_ACCESS: deny-all
  # ...except the in-cluster publishers (Gatus: topic gatus, Alertmanager:
  # am-*), which post as the write-only user `alerts` with a token. User and
  # token are declarative too (NTFY_AUTH_USERS / NTFY_AUTH_TOKENS from Vault
  # apps/ntfy via ntfy-secrets); the same token is ALERTS_NTFY_TOKEN there,
  # read by gatus (deployment env) and alertmanager (ExternalSecret).
  # Declarative ACL (ntfy auth-access, user:topic:perm).
  NTFY_AUTH_ACCESS: "alerts:gatus:wo,alerts:am-*:wo"
  NTFY_ATTACHMENT_CACHE_DIR: "/etc/ntfy/cache/attachments"
  NTFY_TEMPLATE_DIR: "/etc/ntfy/templates"
  NTFY_UPSTREAM_BASE_URL: "https://ntfy.sh"
  NTFY_ENABLE_LOGIN: "true"
  NTFY_LOG_LEVEL: "info"

