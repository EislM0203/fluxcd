---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: karakeep
  dataFrom:
    - extract:
        key: apps/karakeep
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: karakeep-mcp
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: karakeep-mcp
  dataFrom:
    - extract:
        key: apps/karakeep-mcp
