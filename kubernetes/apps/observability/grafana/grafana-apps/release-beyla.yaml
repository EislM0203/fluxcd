---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-beyla
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: beyla
      version: 1.16.11
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    tolerations: 
      - key: node-role.kubernetes.io/control-plane
        operator: "Exists"
        effect: "NoSchedule"
    serviceMonitor:
      enabled: true
    config:
      create: false
      name: "beyla-config"
      data:
        prometheus_export:
          port: 9090
          path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
data:
  beyla-config.yml: |
    log_level: INFO
    routes:
      unmatched: heuristic
    discovery:
      # instrument replaces the deprecated services block; values are globs.
      # Beyla, Alloy and the OTel collector stay excluded by default_exclude_instrument.
      instrument:
        - k8s_namespace: apps
        - k8s_namespace: default
        - k8s_namespace: networking
        - k8s_namespace: auth
        - k8s_namespace: secured
        - k8s_namespace: flux-system
        # - k8s_namespace: storage
    # was "text": printed every span to stdout, which filelog shipped to Loki
    trace_printer: disabled
    otel_traces_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
    otel_metrics_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics
    attributes:
      kubernetes:
        enable: true
        # resource_labels left at Beyla's OTel-spec defaults. Workloads set their identity:
        #   service.name:      annotation resource.opentelemetry.io/service.name,
        #                      else label app.kubernetes.io/instance, then app.kubernetes.io/name,
        #                      else the owning Deployment/StatefulSet name
        #   service.namespace: annotation resource.opentelemetry.io/service.namespace,
        #                      else label app.kubernetes.io/part-of, else the k8s namespace
        # Group an app's components (web, redis, db, ...) with app.kubernetes.io/part-of.
