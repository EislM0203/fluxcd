---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # The chart has no pod-annotation value for the UI; without this Beyla names it
  # after app.kubernetes.io/instance ("longhorn"), shared with other components.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |-
              - op: add
                path: /spec/template/metadata/annotations
                value:
                  resource.opentelemetry.io/service.name: longhorn-ui
  values:
    annotations:
      "resource.opentelemetry.io/service.name": "longhorn-manager"
    persistence: 
      defaultClass: false
    longhornUI:
      replicas: 1
    defaultBackupStore:
      backupTarget: "s3://flux-backup@us-east-1/"
      backupTargetCredentialSecret: s3-secret
      pollInterval: 30