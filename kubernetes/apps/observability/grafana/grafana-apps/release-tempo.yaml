---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-tempo
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: tempo
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    replicas: 1
    # Tempo 3 (chart 3.x): the chart's own config template replaces the custom
    # one, which still carried the removed ingester/compactor/traces_storage
    # blocks. Retention now renders into backend_scheduler.
    tempo:
      reportingEnabled: false
      streamOverHttpEnabled: true
      retention: 12h
      overrides:
        defaults:
          metrics_generator:
            # local-blocks is not supported by Tempo 3
            processors:
              - service-graphs
              - span-metrics
            # Add the app group (service.namespace, from Beyla/k8sattributes) as a label so
            # span metrics and the service graph can be grouped per app.
            processor:
              span_metrics:
                dimensions:
                  - service.namespace
              service_graphs:
                dimensions:
                  - service.namespace
      metricsGenerator:
        # -- If true, enables Tempo's metrics generator (https://grafana.com/docs/tempo/next/metrics-generator/)
        enabled: true
        remoteWriteUrl: "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
        storage:
          # Explicit remote_write (replaces remoteWriteUrl) to send exemplars: trace IDs on
          # latency histograms, linked to Tempo from the Prometheus datasource.
          remote_write:
            - url: "http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/write"
              send_exemplars: true
      # Traces and WAL live in /var/tempo; without a volume they were lost on every restart.
      extraVolumeMounts:
        - name: tempo-data
          mountPath: /var/tempo
    # # this is jaeger
    # # tempoQuery:
    # #   enabled: true
    # #   ingress:
    # #     enabled: true
    # #     className: traefik
    # #     hosts:
    # #       - tempo-query.cloud.traunseenet.com
    # #     annotations:
    # #       traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # #       cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # #     labels:
    # #       app: signoz
    # #     tls:
    # #       - secretName: tempo-cert
    # #         hosts:
    # #           - tempo-query.cloud.traunseenet.com
    service:
      type: ClusterIP
    # A standalone PVC instead of persistence.enabled: that adds volumeClaimTemplates,
    # which are immutable on the existing StatefulSet and would fail the upgrade.
    extraVolumes:
      - name: tempo-data
        persistentVolumeClaim:
          claimName: tempo-data
    serviceMonitor:
      enabled: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-storage
  resources:
    requests:
      # 12h retention; current volume of traces is small
      storage: 5Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: grafanadatasource-tempo
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  uid: tempo
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://grafana-tempo.observability.svc.cluster.local:3200
    jsonData:
      tracesToMetrics:
        spanEndTimeShift: 1h
        spanStartTimeShift: "-1h"
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        customQuery: false
        spanStartTimeShift: "-1h"
        datasourceUid: loki
        spanEndTimeShift: 1h
      streamingEnabled:
        search: true
        metrics: true
      traceQuery:
        timeShiftEnabled: false
        spanStartTimeShift: ""