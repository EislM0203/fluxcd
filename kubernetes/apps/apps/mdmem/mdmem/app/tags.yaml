# mdmem tag vocabulary (TAGS_FILE, issue #18), mounted at /config/tags.yaml next to
# repos.yaml. Read once at startup: a broken file stops mdmem from starting, and
# changing it changes the generated ConfigMap name, so the pod restarts.
# Template and format: tags.example.yaml in traunseenet-lab/mdmem.
#
# Rules agents are told: lowercase kebab-case, singular, 2-6 tags, exactly one scope,
# at most one nature. Aliases rewrite agent writes; unknown tags only warn.
