---
# kata-deploy only writes its runtime as a drop-in in config-v3.toml.d and refuses
# to install ("rendered config ... does not import the drop-in dir") when containerd
# does not import that directory. RKE2 >= 1.36 (containerd 2.3) imports it in its
# own base config; the custom config-v3.toml.tmpl that added the import for 1.35
# now duplicates the key and containerd refuses to start ("key imports is already
# defined"), so this only creates the directory and removes that template.
# Restarts the RKE2 service only when the template was removed, one node at a time
# (rke2-node-1 is the only control plane; its restart pauses the API briefly).
- name: Configure containerd drop-in imports
  hosts: rke2_server:rke2_agents
  become: yes
  serial: 1
  vars:
    containerd_dir: /var/lib/rancher/rke2/agent/etc/containerd
    rke2_service: "{{ 'rke2-server' if inventory_hostname in groups['rke2_server'] else 'rke2-agent' }}"

  tasks:
    - name: Create drop-in directory
      ansible.builtin.file:
        path: "{{ containerd_dir }}/config-v3.toml.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [maintenance, containerd]

    - name: Remove the import template from RKE2 1.35
      ansible.builtin.file:
        path: "{{ containerd_dir }}/config-v3.toml.tmpl"
        state: absent
      notify: Restart RKE2
      tags: [maintenance, containerd]

  handlers:
    - name: Restart RKE2
      ansible.builtin.systemd:
        name: "{{ rke2_service }}"
        state: restarted
