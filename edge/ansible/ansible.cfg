# Edge-only Ansible config (the repo-root ansible.cfg disables host key checking for
# the other modules; edge must not). Selected via ANSIBLE_CONFIG by `make edge-deploy`.
#
# Run from the repo root (make does): UserKnownHostsFile is resolved by ssh relative to
# the current directory. From anywhere else the file is not found and ssh refuses to
# connect (fail closed). Pin host keys in edge/ansible/known_hosts out-of-band first;
# see edge/README.md "Host keys". The VPS ProxyCommand in the tf-rendered inventory.ini
# uses the same file (absolute path).
[defaults]
host_key_checking = True
pipelining = True

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=edge/ansible/known_hosts -o GlobalKnownHostsFile=/dev/null
