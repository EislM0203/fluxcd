---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-api
  labels:
    app: track
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: track
      component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: track
        app: track
        component: api
    spec:
      automountServiceAccountToken: false
      # The image has no USER; the app only writes /data (SQLite) and /tmp (DB import).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.cloud.traunseenet.com/library/track-api:1.2.0@sha256:5585d68c63c6a877444dc6470c7dc4ee781917c26ab2a8dd433d8c6306c58f35
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/track.db
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: track-data
        # DB import uploads (frontend nginx caps them at 20 MiB)
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-web
  labels:
    app: track
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: track
      component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: track
        app: track
        component: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: harbor.cloud.traunseenet.com/library/track-web:1.2.0@sha256:7471a3a932c89671397ddb47f910348463bdad804e471d1f5e43305cdf7bc84f
          env:
            # rendered into the nginx config at start (frontend/nginx.conf)
            - name: API_UPSTREAM
              value: track-api:8000
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# MCP server over the track HTTP API (track repo, mcp/). Called by Bifrost only
# (mcp-networkpolicy.yaml); it has no auth of its own, so the network is the gate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-mcp
  labels:
    app: track
    component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: track
      component: mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: track
        app: track
        component: mcp
    spec:
      automountServiceAccountToken: false
      # The Service "track-mcp" would inject TRACK_MCP_PORT=tcp://<ip>:8000 over
      # the image's TRACK_MCP_PORT=8000, and the server crashes parsing it.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: harbor.cloud.traunseenet.com/library/track-mcp:1.2.0@sha256:bab02468cb7ce5f1d554890988a2c0ba9279de5cc2ba3fab76565d04faccbf36
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # transport, host, port and /mcp path are the image defaults
            - name: TRACK_API_URL
              value: http://track-api.apps.svc.cluster.local:8000
            - name: TRACK_MCP_ALLOW_WRITES
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
