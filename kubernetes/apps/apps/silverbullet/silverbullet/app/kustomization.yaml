---

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - ./secret.yaml            # SOPS: restic-silverbullet only (§12.1)
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./networkpolicy.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: silverbullet-env
    literals:
      # --- network ---------------------------------------------------------
      - SB_HOSTNAME=0.0.0.0
      - SB_PORT=3000
      # metrics live on their own port, never exposed through the HTTPRoute
      - SB_METRICS_PORT=3001
      # --- storage ---------------------------------------------------------
      # /data is the PVC mount point; SB_FOLDER is a subfolder of it because the
      # ext4 root holds lost+found, which detect() counts as "not empty" and boots
      # open single-space (see header). The entrypoint mkdir -p's it (fsGroup 1000).
      # In multi-space mode this folder holds the server config, the accounts and
      # (by default) the spaces — all of it lands in the VolSync backup.
      - SB_FOLDER=/data/space
      # Set explicitly: the entrypoint would otherwise stat /data for the owner.
      - PUID=1000
      - PGID=1000
      # Longhorn is not NFS, so the default native watch (auto) is correct;
      # SB_FS_WATCH=poll is only needed on NFS/SMB mounts.
      # --- shell -----------------------------------------------------------
      # The server-side shell defaults to on (backend "local", empty whitelist =
      # any command). Off in every boot mode; not a legacy var, so it does not
      # change detect(). Remove only if a space really needs shell commands.
      - SB_SHELL_BACKEND=off
