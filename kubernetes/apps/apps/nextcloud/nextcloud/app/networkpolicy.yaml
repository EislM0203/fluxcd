---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud
  policyTypes: ["Ingress"]
  ingress:
    - from:
        # LAN, via the Gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        # Euro-Office fetches and saves documents via StorageUrl
        - podSelector:
            matchLabels:
              app: eurooffice
        # Gatus health check (/status.php)
        - podSelector:
            matchLabels:
              app: gatus
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud-redis-master
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-imaginary-ingress
spec:
  podSelector:
    matchLabels:
      app: nextcloud-imaginary
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 9000
---
# Browsers (Traefik/Pangolin) load the editors; Nextcloud calls it on DocumentServerInternalUrl
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eurooffice-ingress
spec:
  podSelector:
    matchLabels:
      app: eurooffice
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 80
---
# CNPG cluster nextcloud-pg: the app on 5432, its own instances (replication, instance manager),
# the CNPG operator (instance manager API :8000; without it the cluster looks unhealthy
# and cannot be managed) and Prometheus (PodMonitor :9187, CNPG alerts).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-pg-ingress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: nextcloud-pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nextcloud
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: nextcloud-pg
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: storage
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187
