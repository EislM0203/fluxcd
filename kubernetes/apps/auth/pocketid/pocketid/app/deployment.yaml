apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  labels:
    app: pocketid
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketid
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: pocketid
        app: pocketid
    spec:
      containers:
        - name: pocket-id
          image: harbor.cloud.traunseenet.com/ghcr.io/pocket-id/pocket-id:v2.19@sha256:f7299b41ed76d1cf46fd5befc7db660eaa12162dc8af2632d5e23fa78708266a
          env:
            - name: APP_URL
              value: "https://pocketid.cloud.traunseenet.com"
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY                                                                                                           
              valueFrom:                                      
                secretKeyRef:                                                                                                                
                  name: pocketid-secret
                  key: ENCRYPTION_KEY 
          ports:
            - containerPort: 1411
              name: http
              protocol: TCP
          volumeMounts:
            - name: pocketid-data
              mountPath: /app/data
          livenessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 90
            timeoutSeconds: 5
            failureThreshold: 2
          readinessProbe:
            exec:
              command:
                - /app/pocket-id
                - healthcheck
            initialDelaySeconds: 10
            periodSeconds: 90
            timeoutSeconds: 5
            failureThreshold: 2
      volumes:
        - name: pocketid-data
          persistentVolumeClaim:
            claimName: pocketid-data
