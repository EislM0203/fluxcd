---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-api
  labels:
    app: track
    component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: track
      component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: track
        app: track
        component: api
    spec:
      automountServiceAccountToken: false
      # The image has no USER; the app only writes /data (SQLite) and /tmp (DB import).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.cloud.traunseenet.com/library/track-api:1.0.0@sha256:b0466ff5159935719ef563457ddb11e91412c512dcbadc7d7336fb8a2e8d6017
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DB_PATH
              value: /data/track.db
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: track-data
        # DB import uploads (frontend nginx caps them at 20 MiB)
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track-web
  labels:
    app: track
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: track
      component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: track
        app: track
        component: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: harbor.cloud.traunseenet.com/library/track-web:1.0.0@sha256:3e3116254a5388bf2e32e21932aa035370b6d78748ef4bdc8799173e3004754c
          env:
            # rendered into the nginx config at start (frontend/nginx.conf)
            - name: API_UPSTREAM
              value: track-api:8000
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
