---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/volsync.backube/replicationdestination_v1alpha1.json
apiVersion: volsync.backube/v1alpha1
kind: ReplicationDestination
metadata:
  name: mdmem-restore
spec:
  trigger:
    manual: restore-once
  restic:
    repository: restic-mdmem
    storageClassName: longhorn-storage
    accessModes: ["ReadWriteOnce"]
    copyMethod: Snapshot
    capacity: 5Gi
    enableFileDeletion: false
    cleanupCachePVC: false
    cleanupTempPVC: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mdmem-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-storage
  # Do NOT set numberOfReplicas: 1 here. The vault is the primary artefact of
  # this service; an hourly restic snapshot is not block-level redundancy.
  # dataSourceRef:
  #   kind: ReplicationDestination
  #   apiGroup: volsync.backube
  #   name: mdmem-restore
  resources:
    requests:
      storage: 5Gi
