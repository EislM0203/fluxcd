---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: homepage
  name: homepage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: homepage
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: harbor.cloud.traunseenet.com/ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
          imagePullPolicy: IfNotPresent
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: homepage.cloud.traunseenet.com
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          # v2 applies HOMEPAGE_ALLOWED_HOSTS to every request, probes included;
          # without an allowed Host header the kubelet's pod-IP host gets a 400.
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: homepage.cloud.traunseenet.com
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: homepage.cloud.traunseenet.com
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            # Homepage writes its log file into /app/config/logs, which the
            # read-only secret mount above cannot accept. Nesting a writable
            # emptyDir here keeps the rest of the config immutable.
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: config
          secret:
            secretName: homepage-config
            defaultMode: 0444
        - name: logs
          emptyDir: {}
