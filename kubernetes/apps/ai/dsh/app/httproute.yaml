---
# Internal only (websecure-cloud, LAN/WG); the ai namespace is not public.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsh
spec:
  parentRefs:
    - name: traefik
      namespace: networking
      sectionName: websecure-cloud
  hostnames:
    - dsh.cloud.traunseenet.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-forward-auth-dsh
      backendRefs:
        - name: dsh
          port: 3080
