---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 15m
  chart:
    spec:
      chart: traefik
      version: 42.1.2
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # traefik.io CRDs get v3.7 updates; helm skips CRDs on upgrade by default.
    # Safe since chart v41 no longer bundles Gateway API CRDs (those are Flux-managed).
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    #https://github.com/traefik/traefik-helm-chart/blob/master/traefik/VALUES.md
    #apiVersion: traefik.containo.us/v1alpha1
    global:
      sendAnonymousUsage: false
      checkNewVersion: false
    additionalArguments:
      - '--serversTransport.insecureSkipVerify=true'
      - '--log.level=INFO'
      - "--api.insecure=true"
    deployment:
      enabled: true
      kind: DaemonSet
    #  replicas: 1
      annotations: {}
      podAnnotations:
        # Same service.name as Traefik's own OTLP traces; Beyla would otherwise
        # use app.kubernetes.io/instance ("traefik-networking")
        resource.opentelemetry.io/service.name: traefik
        resource.opentelemetry.io/service.namespace: traefik
      additionalContainers: []
      initContainers: []
      # CrowdSec bouncer key (crowdsecLapiKeyFile in addons/middleware-crowdsec.yaml).
      # A file instead of the plugin's inline key / urn:k8s:secret: the resolved
      # plugin config is visible in the (unauthenticated) Traefik API/dashboard.
      # optional: Traefik must start without it (internal traffic); a missing
      # key only fails the public entrypoint closed (see middleware comments).
      additionalVolumes:
        - name: crowdsec-bouncer-key
          secret:
            secretName: crowdsec-bouncer-key
            optional: true
            defaultMode: 0444   # Traefik runs as 65532 without fsGroup
            items:
              - key: BOUNCER_KEY_traefik
                path: lapi-key
    additionalVolumeMounts:
      - name: crowdsec-bouncer-key
        mountPath: /etc/traefik/crowdsec
        readOnly: true
    experimental:
      # Remote plugins are fetched from plugins.traefik.io (+ GitHub) at EVERY
      # pod start into the chart's /plugins-storage emptyDir. Traefik v3.7 with
      # abortOnPluginFailure=false (chart default): if ANY plugin fails to
      # download/compile, Traefik still starts and serves everything, but ALL
      # plugins are disabled -> the public entrypoint's crowdsec middleware
      # cannot be built -> websecure-pub routers are dropped (404, fail-closed).
      # Internal entrypoints are unaffected. Keep the plugin list short.
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.1
    resources:
      requests:
        memory: '1Mi'
        cpu: '1m'
      limits:
        memory: '2Gi'
        cpu: '3000m'
    # Access logs feed CrowdSec (agent tails the Traefik pod logs). JSON is what
    # crowdsecurity/traefik-logs parses best; ClientHost is the PROXY-protocol
    # client on websecure-pub. Enabled globally but switched off per entrypoint
    # (ports.*.observability.accessLogs) so ONLY websecure-pub is logged:
    # public traffic only, negligible volume, internal clients never scored.
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop       # never log Cookie/Authorization
          names:
            User-Agent: keep      # http-bad-user-agent & co. need it
            Referer: keep
    ports:
      web:
        observability:
          accessLogs: false
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        # Ingress/IngressRoute routers without explicit entrypoints would
        # otherwise attach to ALL entrypoints, incl. the public websecure-pub.
        # (Every current route pins websecure; this is a safety net.)
        asDefault: true
        #hostPort: 443
        port: 8443
        #containerPort: 8443
        expose:
          default: true
        exposedPort: 443
        observability:
          accessLogs: false   # internal traffic: not logged, not seen by CrowdSec
        http:
          tls:
            enabled: true
        transport:
          respondingTimeouts:
            readTimeout: 360
      # Public edge: internet -> VPS HAProxy (TCP passthrough, PROXY v2) ->
      # WireGuard -> home VM (DNAT) -> the DEDICATED `traefik-public` LB
      # Service (${EDGE_PUBLIC_LB_IP}:9443, see service.additionalServices).
      # Only the `traefik-public` Gateway (listener port 9443) binds here, so
      # routes on the internal `traefik` Gateway (8443) are never public.
      # Name must stay <= 15 chars (k8s containerPort name limit) -> not
      # "websecure-public".
      #
      # ${EDGE_HOME_IP} / ${EDGE_PUBLIC_LB_IP} are Flux postBuild variables
      # (flux/vars/cluster-settings.yaml, wired in ../ks.yaml). Flux envsubst
      # has NO fail-on-unset (`:?` just behaves like `:=`), so EDGE_HOME_IP
      # defaults to 192.0.2.1 (RFC 5737 TEST-NET-1, never a real peer): if
      # unset, the public Service admits nobody and nothing is trusted —
      # fail closed instead of an invalid "/32" that would crash Traefik.
      websecure-pub:
        port: 9443          # container port == Gateway listener port
        expose:
          default: false    # NOT on the shared LAN LB (traefik)
          public: true      # only on the dedicated traefik-public LB
        exposedPort: 9443   # Service port the home VM DNATs to
        protocol: TCP
        http:
          tls:
            enabled: true
          # Reject requests carrying header-name aliases (e.g. X_Forwarded_For
          # vs X-Forwarded-For) instead of passing them to backends (v3.7.12+).
          aliasHeadersStrategy: reject
          # CrowdSec bouncer + AppSec in front of EVERY router on this entrypoint
          # (Traefik prepends entrypoint middlewares per entrypoint, so routes
          # that are also on the internal `traefik` Gateway are unaffected there).
          # <namespace>-<name>@kubernetescrd; defined in addons/middleware-crowdsec.yaml.
          # Fail-closed: middleware missing / key file missing / plugin not loaded
          # -> routers on this entrypoint are dropped (404); LAPI unreachable ->
          # 403 for every request; AppSec unreachable -> 403.
          # security-headers-public: HSTS (addons/middleware-security-headers.yaml),
          # same fail-closed lifecycle as crowdsec-public.
          middlewares:
            - networking-crowdsec-public@kubernetescrd
            - networking-security-headers-public@kubernetescrd
        # The public Service is externalTrafficPolicy: Local, so the TCP peer
        # Traefik sees is the home VM itself (no kube-proxy SNAT) -> trust
        # exactly that /32. No LAN host or pod can forge a PROXY header.
        proxyProtocol:
          trustedIPs:
            - "${EDGE_HOME_IP:=192.0.2.1}/32"
        # Evaluated against the PROXY-decoded client address: real internet
        # clients are never the home VM, so they cannot spoof X-Forwarded-*.
        forwardedHeaders:
          trustedIPs:
            - "${EDGE_HOME_IP:=192.0.2.1}/32"
        transport:
          respondingTimeouts:
            # same as websecure: Harbor blob uploads stream the whole layer
            # inside one request; 60s cut off big pushes from slow uplinks
            readTimeout: 360
    tracing:
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
    env:
      - name: OTEL_PROPAGATORS
        value: tracecontext,baggage,b3,jaeger
    extraObjects:
      - apiVersion: v1
        kind: Service
        metadata:
          name: traefik-api
        spec:
          type: ClusterIP
          selector:
            app.kubernetes.io/name: traefik
            #app.kubernetes.io/instance: traefik-network
          ports:
            - port: 8080
              name: traefik
              targetPort: 8080
              protocol: TCP
      # Dashboard ingress (LAN only: websecure)
      - apiVersion: networking.k8s.io/v1
        kind: Ingress
        metadata:
          name: traefik-dashboard
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            # api.insecure has no auth of its own (addons/middleware-oauth2.yaml)
            traefik.ingress.kubernetes.io/router.middlewares: networking-oauth2-forward-auth-traefik@kubernetescrd
            cert-manager.io/cluster-issuer: "letsencrypt-prod"
        spec:
          tls:
            - hosts:
              - traefik.cloud.traunseenet.com
              secretName: traefik-cert
          ingressClassName: traefik
          rules:
            - host: traefik.cloud.traunseenet.com
              http:
                paths:
                  - path: /
                    pathType: Prefix
                    backend:
                      service:
                        name: traefik-api
                        port:
                          number: 8080

    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesCRD:
        enabled: true
        ingressClass: traefik
        allowExternalNameServices: true
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        publishedService:
          enabled: true
          pathOverride: "networking/traefik"
      kubernetesGateway:
        enabled: true
        # statusAddress defaults to this chart's Service (networking/traefik),
        # which publishes the LB IP into Gateway status → external-dns target
        experimentalChannel: false
    gateway:
      # the shared Gateway is managed in traefik/addons/gateway.yaml
      enabled: false
    gatewayClass:
      enabled: true
      name: traefik
    rbac:
      enabled: true
    metrics:
      prometheus:
        serviceMonitor:
          enabled: true
    service:
      enabled: true
      spec:
        # chart v40+: type lives under spec (kubernetes-aligned syntax)
        type: LoadBalancer
        # Use DHCP to obtain LoadBalancer IP from network DHCP server
        loadBalancerIP: "0.0.0.0"
      annotations:
        # DHCP configuration - kube-vip creates macvlan with this MAC and requests IP via DHCP
        kube-vip.io/hwaddr: "00:00:6c:43:0c:1e"
        kube-vip.io/loadbalancerHostname: traefik-cluster
        external-dns.alpha.kubernetes.io/hostname: traefik-cluster.internal
      # Dedicated LB for the public edge (ports with `expose.public: true`,
      # i.e. only websecure-pub). Rendered as Service `traefik-public`.
      additionalServices:
        public:
          spec:
            type: LoadBalancer
            # DaemonSet Traefik (incl. control-plane nodes, which are untainted)
            # -> every node kube-vip may elect has a local endpoint. Keeps the
            # home VM's source IP for loadBalancerSourceRanges + trustedIPs.
            externalTrafficPolicy: Local
            # No NodePort: loadBalancerSourceRanges doesn't filter it, so it
            # was a LAN shortcut to websecure-pub (kube-vip doesn't need it).
            allocateLoadBalancerNodePorts: false
            # kube-proxy drops LB traffic from anyone but the home VM
            loadBalancerSourceRanges:
              - "${EDGE_HOME_IP:=192.0.2.1}/32"
          annotations:
            # Static IP via kube-vip-cloud-provider. NOT loadBalancerIP
            # "0.0.0.0" = DHCP mode, which leased a LAN IP in use before. Pick
            # a free IP; kube-vip's pool is 10.0.0.40-49 (kube-system/kubevip
            # configmap).
            kube-vip.io/loadbalancerIPs: "${EDGE_PUBLIC_LB_IP}"
            kube-vip.io/loadbalancerHostname: traefik-public
