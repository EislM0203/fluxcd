---
# Kata pods see volumes through virtio-fs instead of a direct host mount. Checks both
# directions on openebs-lvm: read the restored volume, write and re-read a fresh one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lvmtest-kata-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: openebs-lvm
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lvmtest-kata
spec:
  backoffLimit: 1
  template:
    spec:
      runtimeClassName: kata
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: check
          image: harbor.cloud.traunseenet.com/docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
          command:
            - sh
            - -c
            - |
              set -e
              uname -r
              grep -E ' /(restored|data) ' /proc/mounts
              cd /restored && sha256sum -c SHA256SUMS && echo KATA-READ-OK
              cd /data && head -c 20971520 /dev/urandom > blob && sha256sum blob > blob.sha256
              sync && sha256sum -c blob.sha256 && echo KATA-WRITE-OK
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # Kata sizes the VM from the limits
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: restored
              mountPath: /restored
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: restored
          persistentVolumeClaim:
            claimName: lvmtest-restored-2
        - name: data
          persistentVolumeClaim:
            claimName: lvmtest-kata-data
