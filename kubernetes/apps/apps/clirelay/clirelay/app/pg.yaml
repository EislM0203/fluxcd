---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: clirelay-pg
spec:
  inheritedMetadata:
    labels:
      app.kubernetes.io/part-of: clirelay
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie
  enableSuperuserAccess: true
  primaryUpdateStrategy: unsupervised
  externalClusters:
    - name: &name clirelay-pg
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: *name
          serverName: *name
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: *name
        serverName: *name
  bootstrap:
    # Fresh install. After the first base backup has landed in s3://cnpg-backups/clirelay,
    # switch to recovery (as in ghostfolio's pg.yaml, together with the
    # cnpg.io/skipEmptyWalArchiveCheck annotation) so a rebuild restores from it.
    initdb:
      database: clirelay
      owner: clirelay
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi # request metadata and usage logs grow with traffic
      storageClassName: openebs-lvm
      volumeMode: Filesystem
  monitoring:
    enablePodMonitor: true
  managed:
    services:
      disabledDefaultServices: ["ro", "r"]
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: clirelay-pg
spec:
  retentionPolicy: 20d
  configuration:
    destinationPath: s3://cnpg-backups/clirelay
    endpointURL: http://10.0.0.154:9000
    s3Credentials:
      accessKeyId:
        name: s3-clirelay-pg-backup
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: s3-clirelay-pg-backup
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: bzip2
    wal:
      compression: bzip2
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: clirelay-pg-backup
spec:
  schedule: "0 45 */6 * * *"
  # A base backup right away, so recovery has something to restore from day one.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: clirelay-pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
