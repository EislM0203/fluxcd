---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clirelay-app
  namespace: flux-system
spec:
  targetNamespace: apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: clirelay
  dependsOn:
    - name: cert-manager-addons
    - name: traefik-base
    - name: openebs-lvm
    - name: cnpg
    - name: harbor-app
    - name: external-secrets-app
    - name: hashicorp-vault-app
  path: ./kubernetes/apps/apps/clirelay/clirelay/app
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: clirelay
      namespace: apps
    - apiVersion: apps/v1
      kind: Deployment
      name: clirelay-redis
      namespace: apps
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      name: clirelay-pg
      namespace: apps
  interval: 15m
  retryInterval: 15m
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clirelay-backup
  namespace: flux-system
spec:
  targetNamespace: apps
  commonMetadata:
    labels:
      app.kubernetes.io/name: clirelay
  dependsOn:
    - name: clirelay-app
    - name: volsync
  path: ./kubernetes/apps/apps/clirelay/clirelay/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-kubernetes
    namespace: flux-system
  interval: 15m
  retryInterval: 15m
  timeout: 15m
