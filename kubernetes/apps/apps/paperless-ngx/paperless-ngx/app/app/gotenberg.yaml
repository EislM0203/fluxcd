---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: paperless-gotenberg
  name: paperless-gotenberg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-gotenberg
  template:
    metadata:
      labels:
        app: paperless-gotenberg
        app.kubernetes.io/part-of: paperless
    spec:
      # Renders untrusted documents/URLs: own Kata VM instead of the node kernel.
      runtimeClassName: kata
      containers:
        - image: harbor.cloud.traunseenet.com/docker.io/gotenberg/gotenberg:9.1@sha256:150c1dec38ccb51905f6bd29442706668f2442fb5d290d9eb234708dc054dd1a
          name: gotenberg
          command:
            - "gotenberg"
            - "--chromium-disable-javascript=true"
            - "--chromium-allow-list=file:///tmp/.*"
          ports:
            - containerPort: 3000
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-gotenberg
spec:
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app: paperless-gotenberg
  type: ClusterIP
