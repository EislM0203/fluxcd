---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-beyla
  namespace: observability
spec:
  interval: 15m
  chart:
    spec:
      chart: beyla
      version: 1.16.11
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    tolerations: 
      - key: node-role.kubernetes.io/control-plane
        operator: "Exists"
        effect: "NoSchedule"
    serviceMonitor:
      enabled: true
    config:
      create: false
      name: "beyla-config"
      data:
        prometheus_export:
          port: 9090
          path: /metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beyla-config
data:
  beyla-config.yml: |
    log_level: INFO
    routes:
      unmatched: heuristic
    discovery:
      # instrument replaces the deprecated services block; values are globs.
      # Beyla and Alloy stay excluded by default_exclude_instrument.
      instrument:
        - k8s_namespace: apps
        - k8s_namespace: default
        - k8s_namespace: networking
        - k8s_namespace: auth
        - k8s_namespace: secured
        - k8s_namespace: flux-system
        - k8s_namespace: storage
        - k8s_namespace: observability
      # Added to default_exclude_instrument, not replacing it.
      exclude_instrument:
        # The collector image runs /otelcol-k8s, which the default *otelcol globs miss;
        # tracing it would turn Beyla's own exports into new spans.
        - exe_path: "*otelcol-k8s"
        # Telemetry backends: tracing their ingest/scrape traffic loops back into them.
        - k8s_namespace: observability
          k8s_pod_labels:
            app.kubernetes.io/name: prometheus
        - k8s_namespace: observability
          k8s_pod_labels:
            app.kubernetes.io/name: loki
        - k8s_namespace: observability
          k8s_pod_labels:
            app.kubernetes.io/name: tempo
    # was "text": printed every span to stdout, which filelog shipped to Loki
    trace_printer: disabled
    otel_traces_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/traces
    otel_metrics_export:
      endpoint: http://opentelemetry-collector.observability.svc.cluster.local:4318/v1/metrics
    attributes:
      kubernetes:
        enable: true
        # Workloads set their identity (OTel k8s spec, highest precedence first):
        #   service.name:      annotation resource.opentelemetry.io/service.name,
        #                      else label app.kubernetes.io/instance, then app.kubernetes.io/name,
        #                      else the owning workload's name
        #   service.namespace: annotation resource.opentelemetry.io/service.namespace,
        #                      else label app.kubernetes.io/part-of, else the k8s namespace
        # Group an app's components (web, redis, db, ...) with app.kubernetes.io/part-of.
      # url.full keeps query strings; Beyla redacts a built-in list (token,
      # access_token, password, ...) that lacks the OAuth authorization-code flow.
      sensitive_query_params:
        add:
          - code
          - code_verifier
          - client_assertion
          - id_token_hint
