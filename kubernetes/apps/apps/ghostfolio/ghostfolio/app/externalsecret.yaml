---
# Vault secret/apps/ghostfolio: ACCESS_TOKEN_SALT, JWT_SECRET_KEY (random strings),
# OIDC_CLIENT_ID, OIDC_CLIENT_SECRET (Pocket ID client "ghostfolio"). All of it ends up
# in the app's environment, so nothing else belongs at this path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghostfolio
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ghostfolio-secrets
  dataFrom:
    - extract:
        key: apps/ghostfolio
