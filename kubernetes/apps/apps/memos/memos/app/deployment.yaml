---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: memos
  name: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: memos
        app: memos
    spec:
      containers:
        - name: memos
          image: harbor.cloud.traunseenet.com/ghcr.io/usememos/memos:26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034
          imagePullPolicy: IfNotPresent
          env:
            - name: MEMOS_PORT
              value: "5230"
          envFrom:
            - configMapRef:
                name: memos-config
          ports:
            - name: http
              containerPort: 5230
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/opt/memos
            - name: deployment-config
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: memos-data
        - name: deployment-config
          projected:
            sources:
              - secret:
                  name: memos-idp
              - configMap:
                  name: memos-instance-setting
